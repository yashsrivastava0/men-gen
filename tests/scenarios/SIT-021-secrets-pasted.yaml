# SIT-021: Secrets pasted (keys, passwords)
# Detection: Pattern detection plus C1 flag
# Behavior:  Redact before storing; explain how to connect services securely
id: SIT-021-secrets-pasted
situation: "Secrets pasted (keys, passwords)"
mode: guided
variants:
  api_key_in_the_idea:
    steps:
      - user: "my key is sk-proj-AbCdEfGhIjKlMnOpQrStUvWxYz0123456789abcd and I want an online shop"  # secret-scan: allow
        expect:
          notices: [secret_redacted]
          pending_card: Q-type-01
          slots:
            idea.archetype: {value: commerce}
          text_contains: ["safe way"]
          absent_everywhere: ["sk-proj-AbCdEfGhIjKlMnOpQrStUvWxYz0123456789abcd"]  # secret-scan: allow
      - user: "finish with smart defaults"
        expect:
          state: BRIEF_REVIEW
          absent_everywhere: ["sk-proj-AbCdEfGhIjKlMnOpQrStUvWxYz0123456789abcd"]  # secret-scan: allow
  password_assignment:
    steps:
      - user: "online shop, admin password = Tr0ub4dor&3xyz for the dashboard"
        expect:
          notices: [secret_redacted]
          absent_everywhere: ["Tr0ub4dor&3xyz"]
  connection_string:
    steps:
      - user: "online shop, database is postgresql://shopadmin:S3cretPw99@db.internal:5432/shop"
        expect:
          notices: [secret_redacted]
          absent_everywhere: ["S3cretPw99"]
