# SIT-011: Unsupported type (game, AR, desktop, hardware-heavy, background audio)
# Detection: Stack Profile check
# Behavior:  Say plainly what is not supported; offer the closest option; flag anything needing a development build and its preview limit
id: SIT-011-unsupported-type
situation: "Unsupported type (game, AR, desktop, hardware-heavy, background audio)"
mode: guided
variants:
  development_build_need_is_written_into_the_spec:
    steps:
      - user: "Build me a shop app with defaults"
      - tap: {card: Q-look-01, option: A}
      - decide: {gate: brief}
      - wait_for_plan: true
        expect:
          state: PLAN_REVIEW
          spec: {text_contains: "needs a development build"}
          plan: {research_added_min: 1}
  game:
    steps:
      - user: "I want to build a 3D multiplayer game"
        expect:
          text_contains: ["cannot build this kind of app", "closest I can build"]
          slots:
            idea.archetype: {value: custom}
          pending_card: Q-type-05
  ar:
    steps:
      - user: "I want an augmented reality app to try on glasses"
        expect:
          text_contains: ["cannot build this kind of app"]
          pending_card: Q-type-05
  background_audio:
    steps:
      - user: "I want a music streaming app that keeps playing in the background"
        expect:
          text_contains: ["cannot build this kind of app"]
  hardware_heavy:
    provider_script:
      C1.understand:
        - {intent: idea, confidence: 0.9, language: en, slot_updates: [{slot_id: idea.summary, value_text: "An app to control my drone and raspberry pi"}]}
    steps:
      - user: "I want an app to control my drone and raspberry pi"
        expect:
          text_contains: ["cannot build this kind of app"]
          llm_calls: {C1.understand: 1, C2.interpret_brief: 1}
