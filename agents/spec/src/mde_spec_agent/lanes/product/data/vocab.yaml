# Closed vocabularies of the Product lane that no spec-core file owns (hard rule 8: content lives in data).
# Field types, shapes, mock profiles, emotions and the like are read from spec-core's own vocabularies and graph models.
version: 1
# Error codes an operation may declare. Every one is a code the contract builder knows (checked by a test).
error_codes:
  - unauthenticated
  - forbidden
  - not_found
  - validation_failed
  - conflict
  - duplicate
  - version_conflict
  - idempotency_conflict
  - payment_declined
  - rate_limited
  - unavailable
  - timeout
# What the app does after an error.
recoveries: [stay, retry, go_back, reload, offline, sign_in_again, contact_support]
# Integration modes a model may propose (a real provider is never switched on by a model).
integration_modes: [mock, adapter]
# Evidence kinds a provenance string may start with ("kind:ref").
provenance_kinds: [user, compass, research, library, policy, assumed]
# Release statuses and reasons a plan proposal may use ("none" for an item that is in).
release_reasons: [none, user, capacity, first_release]
