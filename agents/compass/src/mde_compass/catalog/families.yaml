  - id: reminders
    name:
      en: Reminders
      hi: याद दिलाना
    intent: Remind people before a booking so fewer are missed.
  - id: calendar_view
    name:
      en: Calendar view
      hi: कैलेंडर दृश्य
    intent: Show a provider their day and week at a glance.
  - id: booking_history
    name:
      en: Booking history
      hi: पुरानी बुकिंग
