families:
- id: identity_access
  label:
    en: Identity and access
    hi: पहचान और पहुँच
  keywords:
    en:
    - sign in
    - login
    - account
    - profile
    - one-time code
    - password
    hi:
    - साइन इन
    - लॉगिन
    - खाता
    - प्रोफ़ाइल
    - पासवर्ड
    hinglish:
    - login karna
    - khata banana
    - otp se login
    - password bhool gaya
  typical_features:
  - id: sign_up_login
    name:
      en: Sign up and sign in
      hi: साइन-अप और साइन-इन
    intent: Let a person create an account and come back to it later.
  - id: phone_otp
    name:
      en: One-time code by phone
      hi: फ़ोन पर एक बार वाला कोड
    intent: Check that a person owns a phone number without needing a password.
  - id: profile_page
    name:
      en: Profile page
      hi: प्रोफ़ाइल पेज
    intent: Let a person see and update their own details.
  - id: password_reset
    name:
      en: Reset a forgotten password
      hi: भूला हुआ पासवर्ड बदलना
    intent: Let a person regain access when they cannot sign in.
  - id: roles_permissions
    name:
      en: Roles and permissions
      hi: भूमिकाएँ और अनुमतियाँ
    intent: Control what each kind of person can see and do.
  - id: invite_people
    name:
      en: Invite people
      hi: लोगों को आमंत्रित करना
    intent: Let an owner or admin bring new people into the app.
  - id: delete_account
    name:
      en: Delete my account
      hi: मेरा खाता हटाना
    intent: Let a person remove their account and data when they ask.
  typical_roles:
  - visitor
  - member
  - admin
  typical_integrations:
  - sms_one_time_code
  - email
  typical_business_models:
  - free
  - subscription
- id: catalog_commerce
  label:
    en: Catalog and commerce
    hi: कैटलॉग और खरीदारी
  keywords:
    en:
    - shop
    - store
    - catalog
    - cart
    - products
    - order online
    hi:
    - दुकान
    - खरीदारी
    - ऑर्डर
    - सामान
    - कैटलॉग
    hinglish:
    - dukaan
    - saman kharidna
    - online order
    - shopping ka app
  typical_features:
  - id: browse_catalog
    name:
      en: Browse the catalog
      hi: कैटलॉग देखना
    intent: Let people look through everything that is on offer.
  - id: search_filter
    name:
      en: Search and filter
      hi: खोजना और छाँटना
    intent: Help people find the right item quickly.
  - id: item_details
    name:
      en: Item details
      hi: सामान की जानकारी
    intent: Show what a person needs to know before choosing an item.
  - id: cart
    name:
      en: Cart
      hi: कार्ट
    intent: Let people collect items before they decide to order.
  - id: checkout
    name:
      en: Checkout
      hi: चेकआउट
    intent: Let a person confirm an order and choose how to pay.
  - id: order_history
    name:
      en: Order history
      hi: पुराने ऑर्डर
    intent: Let a person look back at what they ordered and reorder.
  - id: reviews_ratings
    name:
      en: Reviews and ratings
      hi: समीक्षा और रेटिंग
    intent: Let people share how an item was so others can choose better.
