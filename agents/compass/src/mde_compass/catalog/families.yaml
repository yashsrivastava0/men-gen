  - customer
  - seller
  - admin
  typical_integrations:
  - payments
  - sms
  - maps
  typical_business_models:
  - commission on each sale
  - monthly plan for sellers
  - margin on items sold
- id: booking_scheduling
  label:
    en: Booking and scheduling
    hi: बुकिंग और समय तय करना
  keywords:
    en:
    - book
    - appointment
    - slot
    - schedule
    - reservation
    - reminder
    hi:
    - बुकिंग
    - अपॉइंटमेंट
