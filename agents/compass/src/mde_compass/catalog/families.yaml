    name:
      en: Browse providers or places
      hi: सेवा देने वाले या जगहें देखना
    intent: Let people see who or what they can book.
  - id: available_slots
    name:
      en: Available times
      hi: उपलब्ध समय
    intent: Show which times are free so a person can pick one.
  - id: book_appointment
    name:
      en: Book a time
      hi: समय बुक करना
    intent: Let a person reserve a time with one clear confirmation.
  - id: reschedule_cancel
    name:
      en: Reschedule or cancel
      hi: समय बदलना या रद्द करना
