slots:
- id: idea.summary
  group: idea
  label:
    en: Your idea in one line
    hi: आपका आइडिया एक पंक्ति में
  level: must
  consumers:
  - all
  filled_by:
  - U
  - D
  impact: 5
  risk: low
  effort: text
  value_schema: &id001
    kind: text
  brief_path: idea.summary
  order: 1
  fallback_card:
    type: open_prompt
    question:
      en: What would you like your app to do?
      hi: आप चाहते हैं कि आपका ऐप क्या करे?
    why_we_ask:
      en: Everything else we plan starts from this.
      hi: बाकी सारी योजना इसी से शुरू होती है।
    options: []
    placeholder:
      en: Describe it in a few words
      hi: कुछ शब्दों में बताइए
- id: idea.category
  group: idea
  label:
    en: Kind of app
    hi: ऐप का प्रकार
  level: must
  consumers:
  - research
  - blueprint
  filled_by:
  - I
  - U
  impact: 5
  risk: low
  effort: tap
  value_schema: *id001
  ask_if: filled('idea.summary')
  brief_path: idea.category
  order: 1
  fallback_card:
    type: choose_one
    question:
      en: Which of these is closest to your app?
      hi: इनमें से कौन सा आपके ऐप के सबसे करीब है?
    why_we_ask:
      en: It tells us which similar apps to study.
      hi: इससे पता चलता है कि कौन से मिलते-जुलते ऐप देखने हैं।
    options:
    - id: A
      label:
        en: People buy or order things
        hi: लोग चीज़ें खरीदते या ऑर्डर करते हैं
      value: commerce
    - id: B
      label:
        en: People book a time or a place
        hi: लोग समय या जगह बुक करते हैं
      value: booking
    - id: C
      label:
        en: A tool for my team to manage work
        hi: मेरी टीम के काम सँभालने का टूल
      value: internal_tool
- id: idea.subcategory
  group: idea
  label:
    en: Kind of app, in detail
    hi: ऐप का प्रकार, विस्तार से
  level: must
  consumers:
  - research
  - blueprint
  filled_by:
  - I
  - U
  impact: 4
  risk: low
  effort: text
  value_schema: *id001
  ask_if: filled('idea.category')
  brief_path: idea.subcategory
  order: 1
  fallback_card:
    type: open_prompt
    question:
      en: What exactly does your business or service do?
      hi: आपका काम या सेवा ठीक-ठीक क्या है?
    why_we_ask:
      en: A precise kind of app lets us study the right examples.
      hi: सही प्रकार पता हो तो हम सही उदाहरण देख पाते हैं।
    options: []
    placeholder:
      en: 'For example: what you sell, offer or manage'
      hi: 'जैसे: आप क्या बेचते, देते या सँभालते हैं'
- id: idea.business_model
  group: idea
  label:
    en: How it earns money
    hi: कमाई कैसे होगी
  level: must
  must_where: money flows
  consumers:
  - research
  - blueprint
  filled_by:
  - U
  - P
  impact: 4
  risk: medium
  effort: tap
  value_schema: *id001
  ask_if: filled('idea.category') and value('idea.category') != 'internal_tool'
  brief_path: idea.business_model
  order: 1
  fallback_card:
    type: choose_one
    question:
      en: How will the app earn money?
      hi: ऐप से कमाई कैसे होगी?
    why_we_ask:
      en: It decides which payment and plan screens are needed.
      hi: इससे तय होता है कि भुगतान और प्लान की कौन सी स्क्रीन चाहिए।
    options:
    - id: A
      label:
        en: A small fee on each sale or booking
        hi: हर बिक्री या बुकिंग पर छोटी फ़ीस
      value: per_transaction_fee
    - id: B
      label:
        en: A monthly or yearly plan
        hi: मासिक या वार्षिक प्लान
      value: subscription
    - id: C
      label:
        en: Free to use; the business pays for it
        hi: इस्तेमाल मुफ़्त; खर्च व्यवसाय उठाता है
      value: business_funded
- id: idea.problem_value
  group: idea
  label:
    en: The problem it solves
    hi: यह किस समस्या को सुलझाता है
  level: should
  consumers:
  - research
  - design
  filled_by:
  - U
  - D
  - I
  impact: 3
  risk: low
  effort: text
  value_schema: *id001
  ask_if: filled('idea.category')
  brief_path: idea.problem_value
  order: 1
  fallback_card:
    type: open_prompt
    question:
      en: What problem should the app solve for people?
      hi: ऐप को लोगों की कौन सी समस्या सुलझानी चाहिए?
    why_we_ask:
      en: It helps us pick what to build first.
      hi: इससे तय होता है कि पहले क्या बनाना है।
    options: []
    placeholder:
      en: Say it in your own words
      hi: अपने शब्दों में बताइए
- id: idea.differentiator
  group: idea
  label:
    en: What makes it different
    hi: इसे अलग क्या बनाता है
  level: should
  consumers:
  - research
  - design
  filled_by:
  - U
  - D
  - I
  impact: 2
  risk: low
  effort: text
  value_schema: *id001
  ask_if: filled('idea.category')
  brief_path: idea.differentiator
  order: 1
  fallback_card:
    type: open_prompt
    question:
      en: What would make your app different from others?
      hi: आपका ऐप दूसरों से अलग कैसे होगा?
    why_we_ask:
      en: It guides the research and the look.
      hi: इससे रिसर्च और रूप की दिशा तय होती है।
    options: []
    placeholder:
      en: One or two lines are enough
      hi: एक-दो पंक्तियाँ काफ़ी हैं
- id: context.geo
  group: context
  label:
    en: Country and city
    hi: देश और शहर
  level: must
  consumers:
  - research
  - blueprint
  - design
  filled_by:
  - U
  - D
  impact: 5
  risk: low
  effort: text
  value_schema:
    kind: geo
    fields:
    - country
    - city
    - region
  ask_if: filled('idea.summary')
  brief_path: context.geo
  order: 1
  fallback_card:
    type: quick_form
    question:
      en: Where will people use it?
      hi: लोग इसे कहाँ इस्तेमाल करेंगे?
    why_we_ask:
      en: Places change which services and habits matter.
      hi: जगह के हिसाब से सेवाएँ और आदतें बदल जाती हैं।
    options: []
    placeholder:
      en: Country and city
      hi: देश और शहर
- id: context.scale_launch
  group: context
  label:
    en: Size and timing of launch
    hi: लॉन्च का आकार और समय
  level: should
  consumers:
  - blueprint
  - frontend
  - qa
  filled_by:
  - U
  - P
  impact: 3
  risk: low
  effort: tap
  value_schema:
    kind: enum
    options:
    - pilot_small
    - single_city
    - wide_launch
  default: pilot_small
  brief_path: context.scale_launch
  order: 8
  fallback_card:
    type: choose_one
    question:
      en: How big will the first launch be?
      hi: पहला लॉन्च कितना बड़ा होगा?
    why_we_ask:
      en: It sets how much the first version must handle.
      hi: इससे तय होता है कि पहला संस्करण कितना सँभालेगा।
    options:
    - id: A
      label:
        en: A small pilot with a few dozen people
        hi: कुछ दर्जन लोगों के साथ छोटा पायलट
      value: pilot_small
    - id: B
      label:
        en: One city or one organisation
        hi: एक शहर या एक संस्था
      value: single_city
    - id: C
      label:
        en: Many cities or a whole country
        hi: कई शहर या पूरा देश
      value: wide_launch
- id: goals.primary
  group: goals
  label:
    en: Main goal
    hi: मुख्य लक्ष्य
  level: should
  consumers:
  - blueprint
  - qa
  filled_by:
  - U
  - D
  - I
  impact: 3
  risk: low
  effort: tap
  value_schema:
    kind: enum
    options:
    - first_users
    - save_time
    - more_revenue
  ask_if: filled('scope.features')
  brief_path: context.goals
  order: 4
  fallback_card:
    type: choose_one
    question:
      en: What matters most in the first version?
      hi: पहले संस्करण में सबसे ज़रूरी क्या है?
    why_we_ask:
      en: It helps us decide what to leave for later.
      hi: इससे तय होता है कि क्या बाद के लिए छोड़ना है।
    options:
    - id: A
      label:
        en: Getting the first real users
        hi: पहले असली उपयोगकर्ता जोड़ना
      value: first_users
    - id: B
      label:
        en: Saving my team's time
        hi: मेरी टीम का समय बचाना
      value: save_time
    - id: C
      label:
        en: Bringing in more revenue
        hi: ज़्यादा कमाई लाना
      value: more_revenue
- id: goals.success_measures
  group: goals
  label:
    en: How success is measured
    hi: सफलता कैसे नापी जाएगी
  level: should
  consumers:
  - blueprint
  - qa
  filled_by:
  - U
  - D
  - I
  impact: 2
  risk: low
  effort: tap
  value_schema:
    kind: enum_list
    options:
    - active_users
    - completed_transactions
    - time_saved
  ask_if: filled('goals.primary')
  brief_path: context.success_measures
  order: 8
  fallback_card:
    type: pick_many
    question:
      en: How will you know the app is working well?
      hi: आपको कैसे पता चलेगा कि ऐप अच्छा चल रहा है?
    why_we_ask:
      en: Clear measures let us test the app against them.
      hi: साफ़ पैमानों से हम ऐप को परख सकते हैं।
    options:
    - id: A
      label:
        en: Number of people using it
        hi: इस्तेमाल करने वालों की संख्या
      value: active_users
    - id: B
      label:
        en: Number of orders or bookings done
        hi: पूरे हुए ऑर्डर या बुकिंग की संख्या
      value: completed_transactions
    - id: C
      label:
        en: Time saved on each task
        hi: हर काम में बचा समय
      value: time_saved
    placeholder:
      en: Add your own measure
      hi: अपना पैमाना जोड़ें
- id: audience.segments
  group: audience
  label:
    en: Who it is for
    hi: यह किनके लिए है
  level: must
  consumers:
  - research
  - design
  - screens
  filled_by:
  - U
  - D
  impact: 5
  risk: low
  effort: text
  value_schema:
    kind: text_list
  default:
  - everyday users
  brief_path: audience.segments
  order: 2
  fallback_card:
    type: open_prompt
    question:
      en: Who will use the app?
      hi: ऐप का इस्तेमाल कौन करेगा?
    why_we_ask:
      en: It shapes the research, the words and the look.
      hi: इससे रिसर्च, शब्द और रूप तय होते हैं।
    options: []
    placeholder:
      en: 'For example: shop owners, students, patients'
      hi: 'जैसे: दुकानदार, छात्र, मरीज़'
- id: audience.traits
  group: audience
  label:
    en: What the users are like
    hi: उपयोगकर्ता कैसे हैं
  level: should
  consumers:
  - design
  - screens
  filled_by:
  - U
  - I
  impact: 3
  risk: low
  effort: tap
  value_schema:
    kind: enum_list
    options:
    - tech_comfortable
    - tech_new
    - older_users
    - multilingual
  ask_if: filled('audience.segments')
  brief_path: audience.traits
  order: 2
  fallback_card:
    type: pick_many
    question:
      en: Which of these describe your users?
      hi: इनमें से कौन सी बात आपके उपयोगकर्ताओं पर लागू होती है?
    why_we_ask:
      en: It sets how simple the screens and words should be.
      hi: इससे तय होता है कि स्क्रीन और शब्द कितने सरल हों।
    options:
    - id: A
      label:
        en: Comfortable with apps
        hi: ऐप चलाने में सहज
      value: tech_comfortable
    - id: B
      label:
        en: New to apps, need very simple screens
        hi: ऐप में नए, बहुत सरल स्क्रीन चाहिए
      value: tech_new
    - id: C
      label:
        en: Older people, large text matters
        hi: बड़ी उम्र के लोग, बड़े अक्षर ज़रूरी
      value: older_users
    - id: D
      label:
        en: Use more than one language
        hi: एक से ज़्यादा भाषाएँ इस्तेमाल करते हैं
      value: multilingual
    placeholder:
      en: Add anything else
      hi: और कुछ जोड़ें
- id: audience.usage_context
  group: audience
  label:
    en: Where and how it is used
    hi: कहाँ और कैसे इस्तेमाल होगा
  level: may
  consumers:
  - design
  - frontend
  filled_by:
  - I
  - P
  impact: 2
  risk: low
  effort: tap
  value_schema:
    kind: enum_list
    options:
    - on_the_go
    - low_network
    - shared_device
  ask_if: filled('audience.segments')
  brief_path: audience.usage_context
  order: 2
  fallback_card:
    type: pick_many
    question:
      en: In what situations will people use it?
      hi: लोग इसे किन हालात में इस्तेमाल करेंगे?
    why_we_ask:
      en: It helps us design for real conditions.
      hi: इससे हम असली हालात के हिसाब से डिज़ाइन कर पाते हैं।
    options:
    - id: A
      label:
        en: While moving, with one hand
        hi: चलते हुए, एक हाथ से
      value: on_the_go
    - id: B
      label:
        en: With a weak or slow internet
        hi: कमज़ोर या धीमे इंटरनेट पर
      value: low_network
    - id: C
      label:
        en: On a phone shared with others
        hi: दूसरों के साथ साझा फ़ोन पर
      value: shared_device
    placeholder:
      en: Add another situation
      hi: कोई और हालात जोड़ें
- id: apps.list
  group: apps
  label:
    en: Apps needed
    hi: ज़रूरी ऐप
  level: must
  consumers:
  - blueprint
  - design
  filled_by:
  - I
  - U
  impact: 5
  risk: low
  effort: tap
  value_schema:
    kind: object_list
    fields:
    - name
    - purpose
    - surface
  ask_if: filled('audience.segments')
  brief_path: apps
  order: 3
  fallback_card:
    type: choose_one
    question:
      en: How many apps do you need?
      hi: आपको कितने ऐप चाहिए?
    why_we_ask:
      en: Each app gets its own screens and sign-in.
      hi: हर ऐप की अपनी स्क्रीन और साइन-इन होती है।
    options:
    - id: A
      label:
        en: One app for everybody
        hi: सबके लिए एक ऐप
      value: one_app
    - id: B
      label:
        en: One app for customers, one for staff
        hi: ग्राहकों का एक ऐप, स्टाफ़ का एक
      value: customer_and_staff
    - id: C
      label:
        en: One app plus a simple manager side
        hi: एक ऐप और प्रबंधकों के लिए सरल हिस्सा
      value: app_plus_admin
- id: roles.list
  group: roles
  label:
    en: Roles
    hi: भूमिकाएँ
  level: must
  consumers:
  - blueprint
  filled_by:
  - I
  - U
  impact: 5
  risk: low
  effort: tap
  value_schema:
    kind: object_list
    fields:
    - name
    - goal
    - permissions
  ask_if: filled('apps.list')
  brief_path: roles
  order: 3
  fallback_card:
    type: pick_many
    question:
      en: Who will use it, and in what role?
      hi: कौन इसे किस भूमिका में इस्तेमाल करेगा?
    why_we_ask:
      en: Each role sees different screens and can do different things.
      hi: हर भूमिका को अलग स्क्रीन और अलग अधिकार मिलते हैं।
    options:
    - id: A
      label:
        en: Customer who uses the service
        hi: सेवा इस्तेमाल करने वाला ग्राहक
      value: customer
    - id: B
      label:
        en: Staff who handle the requests
        hi: अनुरोध सँभालने वाला स्टाफ़
      value: staff
    - id: C
      label:
        en: Manager who sees reports
        hi: रिपोर्ट देखने वाला प्रबंधक
      value: manager
    - id: D
      label:
        en: Partner who offers a service
        hi: सेवा देने वाला साझेदार
      value: partner
    placeholder:
      en: Add a role in your own words
      hi: अपने शब्दों में कोई भूमिका जोड़ें
- id: scope.features
  group: scope
  label:
    en: Features
    hi: सुविधाएँ
  level: must
  consumers:
  - blueprint
  - research
  - change_control
  filled_by:
  - D
  - I
  - U
  impact: 5
  risk: medium
  effort: tap
  value_schema:
    kind: object_list
    fields:
    - name
    - intent
    - status
    - priority
    - tier
  ask_if: filled('roles.list')
  brief_path: scope
  order: 4
  fallback_card:
    type: pick_many
    question:
      en: Which of these should the app have?
      hi: ऐप में इनमें से क्या-क्या होना चाहिए?
    why_we_ask:
      en: This list becomes the plan for the first version.
      hi: यही सूची पहले संस्करण की योजना बनती है।
    options:
    - id: A
      label:
        en: Sign-up and a profile page
        hi: साइन-अप और प्रोफ़ाइल पेज
      value: account_profile
    - id: B
      label:
        en: Search and browse a list of items
        hi: चीज़ों की सूची खोजना और देखना
      value: search_browse
    - id: C
      label:
        en: Messages between people
        hi: लोगों के बीच संदेश
      value: messaging
    placeholder:
      en: Add a feature in your own words
      hi: अपने शब्दों में कोई सुविधा जोड़ें
- id: scope.priority
  group: scope
  label:
    en: What must be in the first version
    hi: पहले संस्करण में क्या ज़रूरी है
  level: should
  consumers:
  - blueprint
  filled_by:
  - U
  impact: 4
  risk: low
  effort: tap
  value_schema:
    kind: enum
    options:
    - must
    - nice
    - later
  ask_if: filled('scope.features')
  brief_path: scope.priority
  order: 4
  fallback_card:
    type: priority
    question:
      en: Which features must be in the first version?
      hi: पहले संस्करण में कौन सी सुविधाएँ ज़रूर चाहिए?
    why_we_ask:
      en: A clear first version is faster to build and test.
      hi: साफ़ पहला संस्करण जल्दी बनता और परखा जाता है।
    options:
    - id: A
      label:
        en: Must have
        hi: ज़रूरी
      value: must
    - id: B
      label:
        en: Nice to have
        hi: हो तो अच्छा
      value: nice
    - id: C
      label:
        en: Later
        hi: बाद में
      value: later
- id: scope.must_not
  group: scope
  label:
    en: What it must not do
