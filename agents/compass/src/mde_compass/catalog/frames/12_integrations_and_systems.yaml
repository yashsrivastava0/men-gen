id: integrations_and_systems
purpose: Find the outside services and existing systems the app must connect to, and any sensitive data.
slots:
- integrations.wanted
- integrations.mode
- data.existing_systems
- data.sensitive
card_type: pick_many
option_source: family
order: 12
option_count: null
max_question_words: 20
max_option_words: 8
guidance: A checklist of services typical for the family, pre-ticking only those the user mentioned. Ask
  whether connections should be real or sample data first. Ask about sensitive information plainly.
style_guide: "Ask about the real-world tools they already use (payments, maps, WhatsApp, a spreadsheet), phrased as what they do today, then whether the app should connect to them now or later."
examples:
- "How do customers pay you today: cash, UPI, or something else?"
- "Where do you keep your stock list now, and should the new tool read from it?"
