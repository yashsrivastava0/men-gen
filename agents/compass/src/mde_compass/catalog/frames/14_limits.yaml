id: limits
purpose: Cover offline use, speed, devices, accessibility and anything that must or must not be used.
slots:
- constraints.offline
- constraints.performance
- constraints.accessibility
- constraints.must_use
- constraints.must_not
- devices.profile
- scope.must_not
card_type: pick_many
option_source: fixed
order: 14
option_count: null
max_question_words: 20
max_option_words: 8
guidance: Mostly assumed from the audience and kept out of the interview. Ask only when the audience or
  usage context makes a limit important. One short checklist, plain words.
style_guide: "Ask about conditions of use that change the build: poor network, old phones, accessibility. Offer them as things to tick, with examples from the user's setting."
examples:
- "Will riders often be out of network range while delivering?"
- "Do any of the seniors need very large text or voice help?"
