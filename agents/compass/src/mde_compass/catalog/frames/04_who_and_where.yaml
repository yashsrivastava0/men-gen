id: who_and_where
purpose: Learn who uses the app, where, and in which languages, with a few related fields on one card.
slots:
- audience.segments
- context.geo
- locales
- audience.traits
- audience.usage_context
card_type: quick_form
option_source: fixed
order: 4
option_count: null
max_question_words: 20
max_option_words: 8
guidance: 'A short form: who the users are in plain words, country and city, chat and app languages. Pre-fill
  whatever is already known and ask only for what is missing. Ask chat and app languages separately.'
style_guide: "Ask about the people and the place together but keep it concrete: which people, in which city, speaking which languages. Use the user's own nouns for the people."
examples:
- "Who will order your tiffin, and in which parts of Pune do you deliver?"
- "Which languages do your senior riders and their families speak at home?"
