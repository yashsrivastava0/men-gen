# Rule tables for the deterministic ambiguity scanner (cmp.scan_ambiguity fallback and mock). Data, not
# logic (hard rule 8). Languages: en, hi (Devanagari), hinglish (Hindi in Latin letters).
version: 1
limits:
  max_findings: 5
  max_items: 80
  max_item_chars: 300
  max_fact_lines: 150
  max_finding_chars: 200
  min_acronym_len: 2
  max_acronym_len: 8
# A vague word is only a finding when the same line gives no number ("fast, under 2 seconds" is fine).
vague:
  words:
    en: [fast, quick, quickly, nice, many, few, some, several, simple, easy, modern, clean, good, great, better, best, user-friendly, intuitive, scalable, robust, lots, big, large, small, cheap, affordable, soon, flexible, powerful, smooth, seamless, appropriate, reasonable, various, minimal, etc]
    hi: [जल्दी, तेज़, तेज, बहुत, कुछ, अच्छा, अच्छी, आसान, सुंदर, ज्यादा, ज़्यादा, कई, बड़ा, छोटा, बढ़िया]
    hinglish: [jaldi, tez, bahut, kuch, accha, achha, acchi, badhiya, aasan, asaan, sundar, zyada, kai, bada, chhota, mast, simple]
  phrases:
    en: [user friendly, easy to use, as soon as possible, a lot of, and so on, state of the art, world class, look and feel]
    hi: [बहुत सारे, और भी कुछ]
    hinglish: [bahut saare, aur bhi kuch, jaldi se jaldi]
# Short capitalised terms that need no definition for a non-technical reader.
common_terms: [OK, API, SMS, OTP, UI, UX, PDF, QR, ID, URL, GPS, FAQ, USB, PIN, TV, PC, CEO, AI, ATM, EMI, KYC, UPI, ISO, USA, UK, EU]
# A share above this is impossible ("150% of customers").
implausible:
  max_percent: 100
