# Wording of the deterministic fallback of cmp.seed_research, per language (data, not logic; hard rule 8).
# Placeholders: {category} {subcategory} {audience} {geo} {business_model} {reference} {flow} {compliance}.
# A term template whose placeholder has no value is skipped; the other texts use the defaults below.
en:
  defaults:
    category: mobile
    audience: its users
    flow: its main task
    global: global
    terms: [mobile app]
  stopwords: [a, an, the, this, that, it, its, and, or, of, in, for, with, apps, app, mobile, global, global]
  requests:
    - key: comparable_features
      topic: "Features of comparable {category} apps"
      question: "Which features do {category} apps for {audience} in {geo} usually offer?"
      decision_unlocked: "Which features belong in the first release"
      entity: "{category} apps"
      terms: ["{category}", "{subcategory}", "{audience}", "features"]
      prefer_sources: [app store listings, official websites]
      depth: standard
      priority: high
      shown_to_user_as: "What similar {category} apps offer in {geo}"
      with_references: true
    - key: local_players
      topic: "Local {category} apps and services in {geo}"
      question: "Which {category} apps and services are used by {audience} in {geo}?"
      decision_unlocked: "Which local habits and alternatives the app must fit"
      entity: "local {category} apps"
      terms: ["{category}", "{subcategory}", "local apps", "{geo}"]
      prefer_sources: [app store listings, local news, official websites]
      depth: standard
      priority: high
      shown_to_user_as: "Who else serves {audience} in {geo}"
    - key: payments
      requires: business_model
      topic: "Payment options for {category} apps in {geo}"
      question: "Which payment methods and providers do {category} apps in {geo} use for {business_model}?"
      decision_unlocked: "Which payment methods to plan for"
      entity: "payment methods"
      terms: ["payment", "{business_model}", "{category}"]
      prefer_sources: [official websites, provider documentation]
      depth: standard
      priority: medium
      shown_to_user_as: "How people pay in {geo}"
    - key: sign_in_messages
      topic: "Sign-in and messaging habits in {geo}"
      question: "How do {audience} in {geo} usually sign in and receive messages from {category} apps?"
      decision_unlocked: "Which sign-in and notification methods to offer"
      entity: "sign-in and messaging"
      terms: ["sign in", "SMS", "notifications", "{category}"]
      prefer_sources: [official websites, provider documentation]
      depth: quick
      priority: medium
      shown_to_user_as: "How people sign in and get messages in {geo}"
    - key: regulation
      topic: "Rules for {category} apps in {geo}"
      question: "Which rules, licences or privacy requirements apply to {category} apps in {geo}?"
      decision_unlocked: "Which compliance needs to plan for"
      entity: "regulation"
      terms: ["rules", "privacy", "{compliance}", "{category}", "{geo}"]
      prefer_sources: [government websites, official websites]
      depth: standard
      priority: medium
      shown_to_user_as: "Rules to know about in {geo}"
  reference_request:
    topic: "How {reference} handles {flow}"
    question: "How does {reference} handle {flow} for {audience} in {geo}?"
    decision_unlocked: "What to borrow from {reference} and what to avoid"
    entity: "{reference}"
    terms: ["{reference}", "{flow}", "{category}"]
    prefer_sources: [app store listings, official websites]
    depth: standard
    priority: medium
    shown_to_user_as: "How {reference} works"
hi:
  defaults:
    category: मोबाइल
    audience: इसके उपयोगकर्ता
    flow: इसका मुख्य काम
    global: global
    terms: [मोबाइल ऐप]
  stopwords: [यह, ये, और, के, की, का, में, से, को, ऐप, global]
  requests:
    - key: comparable_features
      topic: "मिलते-जुलते {category} ऐप की सुविधाएँ"
      question: "{geo} में {audience} के लिए {category} ऐप आम तौर पर कौन सी सुविधाएँ देते हैं?"
      decision_unlocked: "पहले वर्शन में कौन सी सुविधाएँ हों"
      entity: "{category} ऐप"
      terms: ["{category}", "{subcategory}", "{audience}", "सुविधाएँ"]
      prefer_sources: [ऐप स्टोर, आधिकारिक वेबसाइट]
      depth: standard
      priority: high
      shown_to_user_as: "{geo} में मिलते-जुलते {category} ऐप क्या देते हैं"
      with_references: true
    - key: local_players
      topic: "{geo} में स्थानीय {category} ऐप और सेवाएँ"
      question: "{geo} में {audience} कौन से {category} ऐप और सेवाएँ इस्तेमाल करते हैं?"
      decision_unlocked: "ऐप को किन स्थानीय आदतों और विकल्पों के साथ चलना होगा"
      entity: "स्थानीय {category} ऐप"
      terms: ["{category}", "{subcategory}", "स्थानीय ऐप", "{geo}"]
      prefer_sources: [ऐप स्टोर, स्थानीय समाचार, आधिकारिक वेबसाइट]
      depth: standard
      priority: high
      shown_to_user_as: "{geo} में {audience} को और कौन सेवा देता है"
    - key: payments
      requires: business_model
      topic: "{geo} में {category} ऐप के लिए भुगतान के तरीके"
      question: "{geo} में {category} ऐप {business_model} के लिए कौन से भुगतान तरीके इस्तेमाल करते हैं?"
      decision_unlocked: "किन भुगतान तरीकों की योजना बनानी है"
      entity: "भुगतान के तरीके"
      terms: ["भुगतान", "{business_model}", "{category}"]
      prefer_sources: [आधिकारिक वेबसाइट, प्रदाता के दस्तावेज़]
      depth: standard
      priority: medium
      shown_to_user_as: "{geo} में लोग भुगतान कैसे करते हैं"
    - key: sign_in_messages
      topic: "{geo} में साइन इन और संदेशों की आदतें"
      question: "{geo} में {audience} आम तौर पर {category} ऐप में साइन इन कैसे करते हैं और संदेश कैसे पाते हैं?"
      decision_unlocked: "साइन इन और सूचना के कौन से तरीके देने हैं"
      entity: "साइन इन और संदेश"
      terms: ["साइन इन", "SMS", "सूचनाएँ", "{category}"]
      prefer_sources: [आधिकारिक वेबसाइट, प्रदाता के दस्तावेज़]
      depth: quick
      priority: medium
      shown_to_user_as: "{geo} में लोग साइन इन और संदेश कैसे लेते हैं"
    - key: regulation
      topic: "{geo} में {category} ऐप के नियम"
      question: "{geo} में {category} ऐप पर कौन से नियम, लाइसेंस या गोपनीयता की ज़रूरतें लागू होती हैं?"
      decision_unlocked: "किन नियमों की योजना बनानी है"
      entity: "नियम"
      terms: ["नियम", "गोपनीयता", "{compliance}", "{category}", "{geo}"]
      prefer_sources: [सरकारी वेबसाइट, आधिकारिक वेबसाइट]
      depth: standard
      priority: medium
      shown_to_user_as: "{geo} के जानने लायक नियम"
  reference_request:
    topic: "{reference} में {flow} कैसे होता है"
    question: "{geo} में {audience} के लिए {reference} {flow} कैसे सँभालता है?"
    decision_unlocked: "{reference} से क्या लेना है और क्या नहीं"
    entity: "{reference}"
    terms: ["{reference}", "{flow}", "{category}"]
    prefer_sources: [ऐप स्टोर, आधिकारिक वेबसाइट]
    depth: standard
    priority: medium
    shown_to_user_as: "{reference} कैसे काम करता है"
