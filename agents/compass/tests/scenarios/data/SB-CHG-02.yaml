id: SB-CHG-02
title: Undo restores the previous content as a new version, history is never rewritten
tags: [change, undo]
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
  - drive: {}
    expect: {state: BRIEF_REVIEW}
  - edit: {path: idea.summary, value: "A food delivery app for Pune restaurants and their regulars"}
    expect:
      version_increased: true
      slots:
        idea.summary: {contains: regulars}
  - undo: true
    expect:
      version_increased: true
      event_types: [brief_patch]
      slots:
        idea.summary: {contains: food delivery, not_contains: regulars}
  - undo: true
    note: nothing left to undo; the engine says so and nothing breaks
    expect:
      no_error: true
