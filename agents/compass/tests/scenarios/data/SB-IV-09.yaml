id: SB-IV-09
title: Language switch, the chat follows the user, the app languages change only by an explicit card
planner_known_issue: BUG-23
planner_known_issue_note: "a chat-language switch is projected as an app-language fact (locales becomes [hi], not [hi, en]) and the questions already waiting stay in the old language"
tags: [language, hindi]
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
    expect:
      card_language: en
      slots:
        experience.locales: {contains: [hi, en]}
  - say: "मुझे अब हिंदी में बात करनी है"
    note: the user switches the chat to Hindi
    expect:
      card_language: hi
      slots:
        experience.locales: {contains: [hi, en]}
  - say: "let's continue in English please"
    expect:
      card_language: en
      slots:
        experience.locales: {contains: [hi, en]}
