id: SB-CHG-04
title: Not wanting an assumption gives three concrete alternatives and applying one is a tap-backed change
tags: [change, variants, assumptions]
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
  - drive: {mode: you_decide}
    expect: {state: BRIEF_REVIEW}
  - feedback: {target: ASM-003, planner_target: "slot:idea.business_model", reason: dont_want_assumption}
    expect:
      card_frame: change_variants
      card_type: choose_one
  - tap_recommended: true
    expect:
      version_increased: true
      event_types: [brief_patch]
