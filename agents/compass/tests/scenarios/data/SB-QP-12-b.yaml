id: SB-QP-12-b
title: After a side message that changes a fact, the question that was on screen comes back
known_issue: BUG-27
known_issue_note: "a message sent while a planned question is on screen makes the engine show the NEXT question: show_next only takes questions never shown, so the pending one stays 'open' and is never shown again (it is neither answered, dropped nor assumed)"
tags: [planner, voice]
engines: [planner]
steps:
  - say_voice: "I want an app for my tiffin service in Poona for 200 customers, called Dabba Wala"
    expect:
      notice_code: voice_echo
      text_contains: [Poona, Dabba Wala, "200"]
      facts:
        active_contains: ["Poona"]
        unverified_max: 0
      slots:
        context.geo: {contains: poona}
      batch: {mode: initial, total_min: 3, total_max: 3}
  - say_voice: "no, the city is Pune, the transcript got it wrong"
    expect:
      notice_code: picked_up
      facts:
        superseded_contains: ["Poona"]
        active_contains: ["Pune"]
      slots:
        context.geo: {contains: pune, not_contains: poona, history_min: 1}
      card_text_contains: ["Who orders your tiffins"]
final:
  facts: {ids_gapless: true, superseded_min: 1}
