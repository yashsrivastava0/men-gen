id: SB-CHG-01
title: Edit after approval voids only the affected sections and shows a "changed since approval" notice
tags: [gate, change, approval]
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
  - drive: {}
    expect: {state: BRIEF_REVIEW}
  - accept_all: true
  - approve: true
    expect: {state: APPROVED}
  - edit: {path: idea.summary, value: "A food delivery app for restaurants and cloud kitchens in Pune"}
    expect:
      version_increased: true
      event_types: [brief_patch]
      notice_code: changed_since_approval
      state: BRIEF_REVIEW
      voided_includes: [idea]
      voided_excludes: [apps, roles, access, experience, integrations, declined]
      slots:
        idea.summary: {contains: cloud kitchens, history_min: 1}
  - approve: true
    note: the changed Brief is approved again as a new baseline
    expect:
      event_types: [brief_approved]
