id: SB-DC-13-b
title: A message sent while paused gets an answer, not silence
tags: [pause, resume]
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
  - tap_recommended: true
  - pause: true
    expect: {state: PAUSED}
  - say: "I also want loyalty points for regular customers"
    expect:
      event_types: [assistant_message]
