id: SB-GATE-06
title: Gate 1 in enterprise mode, the approver's decision on the current hash approves
tags: [gate, enterprise, approvers]
mode: enterprise
steps:
  - say: "We need an internal field service app for our technicians in Pune, in English"
  - drive: {}
    expect: {state: BRIEF_REVIEW}
  - accept_all: true
  - approve: true
    as: approver
    expect:
      state: APPROVED
      event_types: [brief_approved]
