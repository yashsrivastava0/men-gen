id: SB-QP-04-b
title: The same long text typed as the answer to a card also closes the other needs it answers
known_issue: BUG-26
known_issue_note: "a typed card answer is read with only that card's own needs, so aspects claimed for other needs are dropped: the slots are filled (Locked, FCT-002) but the needs stay partial and the questions about them are still asked"
tags: [planner, facts, monologue]
engines: [planner]
steps:
  - say: "I run a tiffin service and want an app for it"
    expect:
      batch: {mode: initial, total_min: 5, total_max: 5}
      qa: {shown_max: 1}
  - answer_texts:
      - "We deliver about 200 tiffins a day around Baner and Hinjewadi in Pune to office workers. They pay for a monthly meal plan in advance, and our own riders do the deliveries in the 11 to 12 slot"
    expect:
      facts:
        active_min: 5
        active_contains: ["monthly meal plan", "Baner and Hinjewadi", "own riders"]
        unverified_max: 0
      qa:
        dropped_min: 3
        statuses: {Q-003: dropped, Q-004: dropped, Q-005: dropped}
        shown_contains: ["riders get"]
        not_asked_needs: [audience.segments, idea.business_model, context.geo]
      card_text_contains: ["riders get"]
      slots:
        audience.segments: {filled: true, contains: office workers}
        context.geo: {contains: pune}
        idea.business_model: {contains: monthly}
      notice_code: picked_up
      calls:
        counts: {cmp.plan_questions: 1}
final:
  facts: {ids_gapless: true}
  qa: {no_repeats: true}
