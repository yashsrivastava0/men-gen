# One long answer holds the audience, the place, the business model and a rule about the riders. The model
# reports each as a fact that completes its need; the engine drops the questions still waiting for those needs
# and shows the one that is still open.
calls:
  cmp.understand_turn:
    - mock: true
    - facts:
        - type: context
          statement: "Customers are office workers around Baner and Hinjewadi"
          quote: "office workers"
          topics: [audience]
          entities: [Baner, Hinjewadi]
          aspects: ["audience.segments:*", "idea.summary:*"]
          effects:
            - {slot_id: audience.segments, value_json: '["Office workers around Baner and Hinjewadi"]'}
        - type: context
          statement: "The service delivers in Pune, around Baner and Hinjewadi"
          quote: "around Baner and Hinjewadi in Pune"
          topics: [place]
          entities: [Pune]
          aspects: ["context.geo:*"]
          effects:
            - {slot_id: context.geo, value_json: '{"country": "India", "city": "Pune"}'}
        - type: rule
          statement: "Customers pay for a monthly meal plan in advance"
          quote: "pay for a monthly meal plan in advance"
          topics: [pricing]
          aspects: ["idea.business_model:*"]
          effects:
            - {slot_id: idea.business_model, value_json: '"A monthly meal plan paid in advance"'}
        - type: number
          statement: "About 200 tiffins are delivered every day"
          quote: "about 200 tiffins a day"
          topics: [scale]
        - type: rule
          statement: "The service uses its own riders, who deliver in the 11 to 12 slot"
          quote: "our own riders do the deliveries in the 11 to 12 slot"
          topics: [riders]
  cmp.plan_questions:
    - defer_rest: "the idea is short, the rest comes after the first answers"
      domain_hypothesis:
        category: food delivery
        subcategory: tiffin service
        likely_roles: [customer, rider, kitchen]
        confidence: 0.6
      questions:
        - group_id: G1
          group_title: Your tiffin service
          intent: understand a typical day of the tiffin service
          serves: [idea.summary]
          answer_spec: One ordinary day from the first order to the last delivery.
          type: text
          text: "Tell me how a normal day of your tiffin service goes, from the first order to the last delivery."
          why_we_ask: A real day shows what the app has to help with.
          unlocks: ["Research: which similar services to study"]
          examples: ["Orders come in the evening before, we cook at 6 and..."]
        - group_id: G1
          group_title: Your tiffin service
          intent: learn who orders the tiffins
          serves: [audience.segments]
          answer_spec: The kinds of customers and what each wants.
          type: text
          text: "Who orders your tiffins, office workers, families, students, or a mix?"
          why_we_ask: The customers decide what the ordering screens look like.
          unlocks: ["Blueprint: roles"]
          examples: ["Mostly office workers near our kitchen"]
        - group_id: G2
          group_title: Money and place
          intent: learn how customers pay for the tiffins
          serves: [idea.business_model]
          answer_spec: Who pays, how, and how often.
          type: text
          text: "How do customers pay for tiffins, one meal at a time or a plan?"
          why_we_ask: Payment decides what the app must charge and remind.
          unlocks: ["Research: pricing of similar tiffin services"]
          examples: ["They pay at the start of the month"]
        - group_id: G2
          group_title: Money and place
          intent: learn which areas the tiffin service delivers to
          serves: [context.geo]
          answer_spec: The city and the areas covered.
          type: text
          text: "Which city and areas do your tiffins reach?"
          why_we_ask: Place decides maps, rules and competitors to study.
          unlocks: ["Research: local competitors"]
          examples: ["Pune, Baner and Aundh"]
        - group_id: G2
          group_title: Money and place
          intent: learn how the riders get their deliveries
          serves: ["domain:rider_assignment"]
          answer_spec: How riders are given routes and tiffins.
          type: text
          text: "How do your riders get their tiffins and routes each day?"
          why_we_ask: Rider handling is the hard part of any tiffin service.
          unlocks: ["Blueprint: rider screens"]
          examples: ["The kitchen manager hands out routes at 10"]
  cmp.audit_questions:
    - pass_all: true
