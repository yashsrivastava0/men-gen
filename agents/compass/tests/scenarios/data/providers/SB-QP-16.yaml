# The audience answer is edited from office workers to students. The model reads the new text; the engine keeps
# version 1 of the answer (superseded), supersedes its facts, rebuilds the slot from the facts that remain and
# plans the questions that had not been shown yet again for the new audience.
calls:
  cmp.understand_turn:
    - mock: true
    - facts:
        - type: context
          statement: "Customers are office workers in Baner who order lunch every weekday"
          quote: "Office workers in Baner who order lunch every weekday"
          topics: [audience]
          entities: [Baner]
          aspects: ["audience.segments:*"]
          effects:
            - {slot_id: audience.segments, value_json: '["Office workers in Baner"]'}
    - facts:
        - type: context
          statement: "Students and hostel residents near the college want cheap dinners every evening"
          quote: "Students and hostel residents near the college"
          topics: [audience]
          entities: [students, hostel]
          aspects: ["audience.segments:*"]
          effects:
            - {slot_id: audience.segments, value_json: '["Students and hostel residents"]'}
  cmp.plan_questions:
    - defer_rest: later batches
      domain_hypothesis:
        category: food delivery
        subcategory: tiffin service
        likely_roles: [customer, rider, kitchen]
        confidence: 0.6
      questions:
        - group_id: G1
          group_title: Your customers
          intent: learn who orders the tiffins and what they want
          serves: [audience.segments]
          answer_spec: Kinds of customers and what each wants.
          type: text
          text: "Who orders your tiffins, and what do they want from the app?"
          why_we_ask: The customers decide what the ordering screens must do.
          unlocks: ["Blueprint: roles"]
          examples: ["Office workers who want lunch on time"]
        - group_id: G1
          group_title: Your customers
          intent: learn how customers pay for the tiffins
          serves: [idea.business_model]
          answer_spec: Who pays, how, how often.
          type: text
          text: "How do customers pay for your tiffins, one meal at a time or a monthly plan?"
          why_we_ask: Payment decides what the app must charge.
          unlocks: ["Research: pricing of similar tiffin services"]
          examples: ["They pay at the start of the month"]
        - group_id: G2
          group_title: Running the kitchen
          intent: learn who prepares and packs the tiffins
          serves: [roles.list]
          answer_spec: Who does what.
          type: text
          text: "Who in your kitchen prepares and packs the tiffins each morning?"
          why_we_ask: Kitchen roles decide the screens.
          unlocks: ["Blueprint: roles"]
          examples: ["Two cooks and a packer"]
        - group_id: G2
          group_title: Running the kitchen
          intent: learn how the riders get their routes
          serves: [domain:rider_routes]
          answer_spec: How routes are given out.
          type: text
          text: "How do your tiffin riders get their routes each day?"
          why_we_ask: Routes are the hard part of a tiffin service.
          unlocks: ["Blueprint: rider screens"]
          examples: ["The manager hands out a list at 10"]
    - defer_rest: the audience changed, so the rest comes later
      questions:
        - group_id: G1
          group_title: Your student customers
          intent: learn where the students and hostel residents are
          serves: [context.geo]
          answer_spec: The area and hostels.
          type: text
          text: "Which college area and hostels do your tiffins reach for students?"
          why_we_ask: Place decides the delivery areas.
          unlocks: ["Research: local competitors"]
          examples: ["Near the engineering college"]
        - group_id: G1
          group_title: Your student customers
          intent: learn how students pay for dinner tiffins
          serves: [idea.business_model]
          answer_spec: How and how often they pay.
          type: text
          text: "How do students pay for the dinner tiffins, every day or every week?"
          why_we_ask: Student budgets decide the payment steps.
          unlocks: ["Research: student pricing"]
          examples: ["Weekly, in cash"]
  cmp.audit_questions:
    - pass_all: true
    - pass_all: true
