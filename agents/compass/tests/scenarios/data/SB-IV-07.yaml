id: SB-IV-07
title: Enterprise stakeholders disagree, the slot is disputed and never auto-merged
planner_known_issue: BUG-22
planner_known_issue_note: "fact projection passes no contributor to the slot store, so a conflicting statement by a second contributor replaces the value instead of marking it disputed"
tags: [enterprise, conflict]
mode: enterprise
contributors:
  - {id: priya, name: Priya (operations), role: requester}
  - {id: rahul, name: Rahul (sales), role: requester}
steps:
  - say: "We need an internal field service app for our technicians in Pune"
    as: priya
    expect:
      state: [UNDERSTANDING, PLAYBACK, INTERVIEWING]
  - say: "The app should be in English"
    as: priya
    expect:
      slots:
        experience.locales: {contains: en}
  - say: "No, the app must be in Hindi only"
    as: rahul
    note: a second contributor gives a different value for the same slot
    expect:
      slots:
        experience.locales: {status: disputed, not_tier: Locked}
final:
  slots:
    experience.locales: {status: disputed}
