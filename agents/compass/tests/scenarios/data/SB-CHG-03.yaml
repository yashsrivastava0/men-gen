id: SB-CHG-03
title: Lookup chips can be added and removed, the research requests follow
tags: [change, research-seeding]
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
  - drive: {}
    expect:
      state: BRIEF_REVIEW
      event_types: [lookup_preview]
      slots:
        research_requests: {count_min: 1}
  - lookup_add: "also check how local competitors handle refunds"
    expect:
      version_increased: true
      slots:
        research_requests: {contains: refund}
  - lookup_remove: refund
    expect:
      slots:
        research_requests: {not_contains: refund}
