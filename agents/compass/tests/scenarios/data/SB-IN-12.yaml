id: SB-IN-12
title: '"Exactly like [brand]": patterns borrowed, never brand assets or copy; confirm before treating as a reference'
tags: [references, brand]
steps:
  - say: "I want a food delivery app in Pune exactly like Zomato, same logo and same screens"
    expect:
      state: [UNDERSTANDING, PLAYBACK, INTERVIEWING]
      slots:
        references: {contains: zomato, not_tier: Locked}
        experience.brand: {not_contains: zomato}
      text_any: [pattern, layout, flow, own brand, your own, logo, copy, borrow]
  - drive: {until_frame: apps_you_like}
    note: the references frame must ask what to borrow and what to avoid, naming the brand the user used
    expect:
      card_frame: apps_you_like
      card_text_contains: [zomato]
  - drive: {}
    expect:
      state: BRIEF_REVIEW
final:
  slots:
    experience.brand: {not_contains: zomato}
    scope.references: {not_tier: Locked}
