[project]
name = "mde-research-agent"
version = "0.1.0"
description = "Research: the second agent. After Gate 1 it searches the web and hands Spec one structured, quote-verified playbook (research.json)."
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "mde-llm-gateway",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pypdf>=5.0",
  "trafilatura>=2.0",
  "jsonschema>=4.23",
  "regex>=2024.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_research_agent"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
mde-llm-gateway = { workspace = true }
