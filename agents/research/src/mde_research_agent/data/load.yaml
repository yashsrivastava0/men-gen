# Research load: computed from the CONTENT of the Brief, never from the Compass tier (AD-49).
#   load_score = features + facts(kinds below) + weights.app * apps + weights.sensitive * sensitive flags
#                + weights.reference * named references
# Class boundaries are calibrated on three real runs (about 17, 30 and 90); retune on more evidence.
weights:
  feature: 1
  fact: 1
  app: 3
  sensitive: 5
  reference: 2
fact_kinds: [rule, compliance, integration_detail, nfr]
# A class applies while score < below; the last class has no bound.
classes:
  - {name: focused, below: 25}
  - {name: standard, below: 61}
  - {name: deep}
