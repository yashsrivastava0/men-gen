  - {domain: developer.android.com, topics: [android, play store, design, accessibility], class: official}
  - {domain: m3.material.io, topics: [material design, components, design], class: official}
  - {domain: material.io, topics: [material design, design], class: official}
  - {domain: support.google.com, topics: [google play, android, store listing], class: help}
  - {domain: w3.org, topics: [accessibility, wcag, web standards], class: official}
  - {domain: unicode.org, topics: [unicode, scripts, text], class: official}
  - {domain: iso.org, topics: [standards, iso], class: official}
  - {domain: reactnative.dev, topics: [react native], class: official}
  - {domain: docs.expo.dev, topics: [expo], class: official}
  - {domain: pcisecuritystandards.org, topics: [pci, card payments], class: official}
  # store policy and data-protection (the trust job)
  - {domain: play.google.com, topics: [data safety, google play policy, privacy, store listing], class: official}
