# Ceilings per research-load class. SOFT numbers are targets the run aims at (a covered topic simply stops
# early); HARD numbers are never exceeded (RV-12). Result quality first: raise these when runs end with
# coverage still improving. Seconds are wall-clock. A page is one the run READ (a refused page is refunded): it costs about
# 0.05 of a search (one extraction call), so the hard page ceiling must let every planned topic read its pages_per_topic.max
# in round one and still leave room for round two; the loader refuses data that does not (the Small run of 2026-11-11
# ran out of pages at 40 with ten topics, starved a topic and paid seven searches that could read nothing).
# `targets` (soft) is the cap on the topics that are NOT of a risk class. Topics of a risk class (regulation, integrations,
# identity, data protection, payments: `risk:` in data/jobs and plan.yaml `risk_by_need`) run outside that cap, as many as the
# Brief asks for; `risk_topics` is only a safety valve for a Brief that asks for far too many, set so that cap + valve topics
# still get about 1.6 round-one searches each from the 70% pool the director spends first (0.7 x hard searches / 1.6 - targets:
# focused 28 / 1.6 - 12 = 5, standard 67 / 1.6 - 24 = 18, deep 119 / 1.6 - 38 = 36). A risk topic past the valve competes under
# the cap like any other. D-163: Small 12, Medium 24, Big 38 topics; searches and pages as set here.
# The three caps (store_tokens, chunk_items, digest_tokens) replace the old silent size cap: items above the store limit
# move to an appendix, none is deleted.
focused:
  # 2026-11-13, first live Small run on the new plan (15 topics): it used the whole 40-search ceiling in round one (39
  # queries, 8 of them provider follow-ups) and stopped with 7 topics unfinished. 52 searches leave room for the gap
  # rounds; two providers follow up (the ones of the highest-priority services topics), not three.
  soft: {searches: 36, pages: 56, seconds: 220, rounds: 2, lanes_search: 6, lanes_extract: 8, targets: 12, followups_per_topic: 2}
  hard: {searches: 52, pages: 80, seconds: 360, rounds: 3, followups_per_topic: 3}
  risk_topics: 5
  provider_followups: 2
  store_tokens: 40000
  chunk_items: 120
  digest_tokens: 4000
standard:
  # 2026-11-13, first live Medium run on the new plan (34 topics): it used 91 of 96 searches and all 130 pages in 244 s
  # and left 13 topics unfinished (20 of 40 required slots). Round one alone reads about 3 pages for each of 34 topics.
  soft: {searches: 90, pages: 130, seconds: 600, rounds: 3, lanes_search: 8, lanes_extract: 12, targets: 24, followups_per_topic: 2}
  hard: {searches: 130, pages: 180, seconds: 900, rounds: 3, followups_per_topic: 3}
  risk_topics: 18
  provider_followups: 5
  store_tokens: 40000
  chunk_items: 120
  digest_tokens: 7000
deep:
  # sized from the Medium run the same day: 54 to 69 topics need about 3 pages each in round one
  soft: {searches: 160, pages: 230, seconds: 900, rounds: 3, lanes_search: 10, lanes_extract: 16, targets: 38, followups_per_topic: 2}
  hard: {searches: 220, pages: 300, seconds: 1500, rounds: 4, followups_per_topic: 3}
  risk_topics: 36
  provider_followups: 8
  store_tokens: 40000
  chunk_items: 120
  digest_tokens: 11000
# A round that fills fewer than this share of the remaining required slots ends the run (R19).
min_round_gain: 0.10
# Pages kept per topic after triage; at most this many per registrable domain.
pages_per_topic: {min: 3, max: 5}
max_per_domain: 2
# Parallel query variants per topic in a round.
variants_per_topic: 3
