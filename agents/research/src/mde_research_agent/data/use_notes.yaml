# One short note per kind of item that says how Spec should use it (at most 15 words; no numbers, names or
# dates: a note must never add a fact). The assemble call may choose another note per item; these are the
# deterministic defaults and the mock.
competitor: "Comparable app: use it to judge which features are usual."
reference_check: "App you named: borrow patterns and ideas, never its branding."
screen_pattern: "Typical screen: use it for sections, states and actions."
navigation_pattern: "Navigation convention: use it to choose the app structure."
role_pattern: "Typical role tasks: use them to check who can do what."
workflow: "Usual journey: use it for steps, alternatives and exceptions."
entity_pattern: "Usual data shape: use it for fields, types and validation."
lifecycle: "Usual states and transitions for this record."
rule: "Rule with a value: confirm it before relying on it."
service_option: "Provider option: compare authentication, events, sandbox and limits."
compliance_note: "Regulatory information, not advice: confirm with a professional."
design_convention: "Category convention: use it as a default, not a rule."
script_need: "Script and font need: apply it to typography and layout."
local_format: "Local format: use it for validation and sample data."
data_hint: "Realistic sample data: use it for mock content."
trend: "Recent change: consider it before locking the design."
