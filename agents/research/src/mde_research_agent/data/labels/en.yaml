# User-facing text for events, built by CODE from these templates and from the Brief's own words
# (never written by a model at run time). Add a file labels/<lang>.yaml to localize; a missing key falls
# back to English. Placeholders in braces.
depth_words:
  focused: "a focused look"
  standard: "a standard-depth study"
  deep: "a deep study"
events:
  run.started: "Researching your idea ({depth_word}, up to about {minutes} minutes)"
  plan.ready: "Research plan ready: {n} topics"
  target.started: "Looking into: {topic}"
  target.covered: "Covered: {topic}"
  target.not_found: "Could not find reliable information on: {topic}"
  target.cancelled: "Skipped at your request: {topic}"
  query.issued: "Searching: {query}"
  search.results: "Found {count} results ({domains})"
  page.reading: "Reading {domain}"
  page.read: "Read {domain}"
  page.skipped: "Could not read {domain} ({reason})"
  fact.found: "Found something to check ({topic})"
  fact.verified: "Checked against the source ({domain})"
  fact.rejected: "Set aside a finding that did not check out"
  entity.discovered: "Found: {name}"
  round.completed: "Round {round} done: {filled} of {required} needed details found"
  gap.detected: "Taking a second look at {n} topics"
  warning: "{message}"
  run.finished: "Research finished: {facts} checked findings from {pages} pages"
  run.skipped: "Research skipped. {facts} checked findings kept"
  run.failed: "Research could not finish: {reason}"
warnings:
  slow_provider: "The search service is slow right now. Still working."
  rate_limited: "The search service asked us to slow down. Waiting a moment."
  provider_down: "The search service is not answering. Finishing with what we have."
  model_failed: "A step took too long and was skipped."
  taking_longer: "Taking a bit longer than planned because new details are still turning up."
  budget_stop: "Stopped at the research budget. Finishing with what we have."
  no_keys: "Search is not set up, so research was skipped."
  no_results: "The web search returned nothing useful for any topic, so research stopped early."
  store_over_limit: "The required findings alone are longer than the usual limit, so the file is larger than usual."
  validation_failed: "A final self-check found a problem, so the result is marked partial."
reasons:
  no_content: "no readable text"
  paywall: "behind a login or paywall"
  blocked: "blocked automated reading"
  robots: "the site asks not to be read automatically"
  private: "not a public page"
  timeout: "too slow"
  too_large: "too large"
  unsupported: "unsupported file type"
  not_found: "page not found"
  error: "could not be read"
declined: "We already know this: {topic}"
declined_user: "Left out as you asked: {topic}"
