# Planner heuristics. Everything the planner decides from the Brief with plain code lives here as data.
# Names in these lists are generic words (never a company, place or product from any one example).

# Entity, module and topic names that are generic scaffolding in almost every app: still researched when
# there is budget (norms for Spec-critical areas are always worth grounding) but ranked low.
generic_entities: [user, users, account, accounts, role, roles, session, setting, settings, notification, notifications, audit log, log, permission, permissions, profile]
generic_modules: [account, accounts, settings, notifications, profile, sign in, onboarding, admin, help]
# Fact topic tags that say nothing about a rule worth researching.
generic_topics: [users, user, location, idea, scope, languages, language, business, requirements, requirement, roles, role, apps, app, data, constraints, constraint, brand, general, context, integrations, preference, preferences, summary, goal, goals, audience, launch]
# Fact kinds that carry rules, numbers and legal-adjacent statements.
rule_fact_kinds: [rule, compliance, number, nfr, integration_detail]
# Priority adjustments (the template's own priority is the base, 0 to 100).
priority_bonus:
  must: 8
  nice: 0
  later: -4
  locked: 5
  default_tier: 0
  request_high: 10
  request_medium: 4
  generic_entity: -20
  generic_module: -15
  geo_uncertain: 0
  template_request: 0
# Platform guideline sources: named official documentation, researched as design conventions (restrict to the domain).
platforms:
  - {name: "Apple Human Interface Guidelines", domain: developer.apple.com}
  - {name: "Material Design", domain: m3.material.io}
# Which job a trusted request belongs to (plan/routing.py). Words, and two-word phrases for stronger cues, in the languages
# Compass writes requests in (en first; other languages extend a list). A word in the request's TOPIC line counts three
# times as much as one in its question or decision; the words of the app's own category are ignored; the highest score
# wins, a tie goes to the job whose word comes first in the topic line (then to the job listed first in JOB_NAMES), and a request none of these words matches is placed by the words
# its topic shares with a planned topic (or reported as unmapped). Generic vocabulary only: never a company, place or
# product. To change where a request goes, change a list here.
request_jobs:
  features: [feature, features, comparable, competitor, competitors, competing, differentiation, differentiate, alternative, alternatives, demand, landscape, platforms, tools, software, solutions, offer, offers, offerings, used, market, players, "local providers", "local players", "local services", "company profiles", "company profile", pricing, trends]
  structure: [roles, role, access, accounts, account, staff, permissions, permission, sign-in, signin, login, approval, approvals, approve, approver, authorisation, authorization, authorise, authorize, administration, admin, hierarchy, navigation, menus, onboarding]
  flows: [flow, flows, journey, journeys, process, workflow, workflows, lifecycle, handover, offline, sync, exceptions, exception, cancellation, rescheduling, dispatch, assignment, escalation]
  data: [rules, rule, compliance, regulation, regulations, regulator, regulatory, requirements, tax, gst, invoice, invoicing, fees, fee, commission, commissions, legal, law, laws, statutory, mandatory, obligation, obligations, duties, duty, deadline, deadlines, retention, residency, consent, privacy, permit, permits, licence, license, penalty, penalties, audit, inspection, inspections, expiry, validity, renewal, revision, versioning, reports, reporting, records, "record keeping"]
  services: [api, apis, sdk, provider, providers, gateway, gateways, integration, integrations, sms, otp, messaging, message, messages, text, push, alert, alerts, reminder, reminders, notification, notifications, email, whatsapp, payment, payments, "mobile money", wallet, card, cards, telematics, gps, tracking, fastag, toll, geocoding, maps, webhook, sandbox, portal, portals, export, exports, import, imports, csv, kyc]
  design: [design, look, ux, ui, brand, style, colour, color, typography, font, fonts, icon, icons, theme, accessibility]
  screens: [screen, screens, layout, layouts, dashboard, dashboards, page, pages, views]
  local: [format, formats, numbers, terminology, vocabulary, wording, words, translation, translations, language, languages, locale, terms, glossary]
# Topics about the app as a whole ("job:template"): a request of that job that shares no word with a more specific topic is
# carried by one of these. A job not listed here leaves such a request unmapped (the preview says so).
request_catch_all: ["features:landscape", "structure:screen_inventory", "screens:key_screens", "design:conventions"]
# Maximum number of model-proposed extra topics accepted per run (the code validates every one).
max_extra_targets: 6
# Discovery names from model memory (competitors, providers): only used in discovery queries, labelled entity_from_model.
max_discovery_names: 6
# Terms mixed into a topic's query terms for passage selection, in addition to its anchors and slot terms.
base_terms_max: 24
