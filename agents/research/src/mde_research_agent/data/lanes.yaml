# Which Spec lane reads which kind of item, which builder need (BN-xx of doc 12) a kind of item informs, and
# the order lanes are rendered in. A kind can feed several lanes. ``min_all`` / ``min_any``: the fields an item of the
# kind must still have after the checker nulled the fields the page does not state (all of ``min_all``, and at least one
# of ``min_any`` when it is not empty); an item below its minimum is dropped as ``unsupported_field``.
lanes: [blueprint, integrations, design, screens, mock, verify]
kinds:
  competitor:        {lanes: [blueprint], need: BN-02, area: feature, terms: [features, pricing, plans, platforms, alternatives], min_all: [name], min_any: []}
  reference_check:   {lanes: [blueprint], need: BN-02, area: feature, terms: [features, flows, pricing, alternatives], min_all: [name, status], min_any: []}
  screen_pattern:    {lanes: [blueprint, screens], need: BN-09, area: screen, terms: [screen, sections, components, actions, states, empty, error, loading, validation], min_all: [screen_key], min_any: [sections, key_components, actions, states]}
  navigation_pattern: {lanes: [blueprint, design], need: BN-03, area: navigation, terms: [navigation, tabs, menu, drawer, structure], min_all: [pattern], min_any: [typical_items, when_used]}
  role_pattern:      {lanes: [blueprint], need: BN-03, area: role, terms: [role, tasks, permissions, access, admin], min_all: [role], min_any: [typical_tasks, typical_permissions]}
  workflow:          {lanes: [blueprint, screens], need: BN-03, area: flow, terms: [steps, flow, process, alternative, exception, error], min_all: [name], min_any: [steps]}
  entity_pattern:    {lanes: [blueprint, mock], need: BN-04, area: entity, terms: [fields, status, type, required, validation, relations], min_all: [entity], min_any: [fields]}
  lifecycle:         {lanes: [blueprint], need: BN-04, area: entity, terms: [status, states, transitions, lifecycle], min_all: [entity], min_any: [states, transitions]}
  rule:              {lanes: [blueprint, screens, verify], need: BN-05, area: rule, terms: [rule, limit, fee, rate, percent, days, threshold, formula], min_all: [statement, subject], min_any: []}
  service_option:    {lanes: [integrations, verify], need: BN-10, area: integration, terms: [api, authentication, webhook, events, sandbox, limits, fees], min_all: [need, provider], min_any: []}
  compliance_note:   {lanes: [blueprint, verify], need: BN-05, area: rule, terms: [regulation, rule, requirement, authority, effective], min_all: [topic, summary], min_any: []}
  design_convention: {lanes: [design], need: BN-08, area: design, terms: [design, layout, navigation, typography, color, density, accessibility], min_all: [aspect, convention], min_any: []}
  script_need:       {lanes: [design], need: BN-08, area: design, terms: [font, script, direction, text, expansion], min_all: [script], min_any: [languages]}
  local_format:      {lanes: [design, mock, screens], need: BN-07, area: format, terms: [format, pattern, validation, example, number, id], min_all: [kind, pattern], min_any: []}
  data_hint:         {lanes: [mock], need: BN-07, area: sample, terms: [examples, names, prices, units, range], min_all: [kind], min_any: [examples, value_range]}
  trend:             {lanes: [blueprint, design], need: BN-02, area: trend, terms: [new, recent, trend, added, launched], min_all: [topic, what_changed], min_any: []}
  provider_fact:     {lanes: [integrations, verify], need: BN-10, area: provider_fact, terms: [api, authentication, sandbox, fees, limits, webhook, sdk, onboarding, settlement, status], min_all: [provider, need, field, value], min_any: []}
  platform_constraint: {lanes: [integrations, screens, verify], need: BN-10, area: platform, terms: [permission, review, policy, config, plugin, development, build, requirement, guideline], min_all: [capability, rule], min_any: []}
# Kinds whose claims are high impact by default (prices, fees, rules, legal and payment facts, formats that
# change validation). The extraction model may raise impact; code never lowers these.
high_impact_kinds: [rule, compliance_note, service_option, local_format]
legal_adjacent_kinds: [rule, compliance_note]
# Kinds counted into norms (prevalence): the area of a norm and the key the code reads.
norm_areas: [feature, screen, flow, entity, integration, design]
# The decisions each Spec lane must make, and the kinds of item (optionally narrowed to dossier `fields`, or to items carrying
# one of `flags_any`) that inform each. `lane_decisions` in research.json lists, for every decision, the main-store items of
# the lane that inform it with a usable evidence label, or an explicit gap with its reason, so Spec sees what it must assume
# (assemble/decisions.py). Text is for Spec, in plain words; no number, name or date.
decisions:
  blueprint:
    - {id: BP-FEATURES, text: "Which features are in the first release, which come later, and which comparable apps set the norm", kinds: [competitor, reference_check, trend]}
    - {id: BP-STRUCTURE, text: "Which screens and which navigation structure each app and role needs", kinds: [screen_pattern, navigation_pattern]}
    - {id: BP-ROLES, text: "What each role can see and do", kinds: [role_pattern]}
    - {id: BP-JOURNEYS, text: "The steps, alternatives and exceptions of each main journey", kinds: [workflow]}
    - {id: BP-DATA, text: "The records, their fields, statuses and relations", kinds: [entity_pattern, lifecycle]}
    - {id: BP-RULES, text: "The business rules, limits and formulas the app must apply", kinds: [rule, compliance_note]}
  integrations:
    - {id: IN-PROVIDERS, text: "Which provider serves each integration, in which countries and with which products", kinds: [provider_fact, service_option]}
    - {id: IN-CONTRACT, text: "How each provider is authenticated, which events it sends and how it is tested", kinds: [provider_fact], fields: [auth_method, endpoints, webhooks_events, sandbox]}
    - {id: IN-TERMS, text: "What each provider charges and limits", kinds: [provider_fact], fields: [fees, limits]}
    - {id: IN-GO-LIVE, text: "What each provider requires before going live and how fast it pays out", kinds: [provider_fact], fields: [onboarding_kyc, onboarding_lead_time, settlement, compliance]}
    - {id: IN-BUILD, text: "Whether each SDK works in the Expo toolchain or needs a development build", kinds: [provider_fact], fields: [sdk_support, react_native_support, expo_build]}
    - {id: IN-PLATFORM, text: "Which platform rules, permissions and build setup each capability needs", kinds: [platform_constraint]}
  design:
    - {id: DS-LOOK, text: "The look and feel conventions: layout, components, tone, density", kinds: [design_convention]}
    - {id: DS-SCRIPT, text: "Fonts, direction and text expansion for each language", kinds: [script_need]}
    - {id: DS-CHANGES, text: "Recent changes in design that affect the first release", kinds: [trend]}
  screens:
    - {id: SC-CONTENT, text: "The sections, components, actions and states of the key screens", kinds: [screen_pattern]}
    - {id: SC-EXCEPTIONS, text: "What a screen shows when data is missing, a step fails or the network drops", kinds: [workflow]}
    - {id: SC-INPUTS, text: "The input formats and validations of forms", kinds: [local_format, rule]}
    - {id: SC-PERMISSIONS, text: "Permission prompts and store disclosures the screens must carry", kinds: [platform_constraint, compliance_note]}
  mock:
    - {id: MK-FORMATS, text: "The formats and identifiers realistic data must follow", kinds: [local_format]}
    - {id: MK-SAMPLES, text: "Realistic names, prices, units and edge cases", kinds: [data_hint]}
    - {id: MK-SHAPES, text: "The shape of each record for fixtures", kinds: [entity_pattern]}
  verify:
    - {id: VF-CONFIRM, text: "The numbers and legal facts the owner confirms before the build", kinds: [rule, compliance_note, provider_fact, platform_constraint, service_option], flags_any: [needs-confirm]}
# The note Spec reads next to a decision that has no usable item (the reason is computed by code).
decision_gaps:
  unverified_only: "Research found only statements it could not verify: assume this from the module library and mark it assumed."
  not_found: "The topics ran and found nothing usable: assume this from the module library and mark it assumed."
  not_run: "The topics for this did not run within the budget: assume this from the module library and mark it assumed."
  not_planned: "No topic of this run could inform it: assume this from the module library and mark it assumed."
