# Job: features. Spec decision: Scope (BLUE-1). Finds comparable and local apps, the feature set by
# commonness (core, common, advanced, emerging), recent additions and pricing models.
job: features
spec_need: Scope
lane: blueprint
recency: true
intent: [features, pricing, comparison]
kinds: [competitor, reference_check, trend]
extract_focus: >
  For each comparable app or product name it, its region, platforms, pricing model and EVERY distinct feature
  the page lists, each with a level (core when the page presents it as a main capability, standard, premium for
  paid or advanced). Use short lowercase normalized feature keys (for example "class booking", "waitlist").
  Record recent additions as trends with the date.
targets:
  - id: landscape
    label: "Comparable {category_apps}"
    foreach: none
    question: "Which {category_apps} are used in {place}, which features does each offer and how is each priced?"
    decision_unlocked: "Which features belong in the first release and which are common, advanced or emerging"
    needs: [norm, entity, current]
    priority: 100
    anchor: category
    scope: country
    slots:
      - {key: competitors, type: count, kind: competitor, distinct_by: name, min: 3, attr: features, attr_min: 5, required: true}
      - {key: feature_norms, type: distinct_values, kind: competitor, distinct_by: name, attr: features, min: 8, min_support: 2, required: true}
  - id: references
    label: "Apps you mentioned: {entity}"
    foreach: reference
    max: 3
    question: "What features, flows and pricing does {entity} offer?"
    decision_unlocked: "Which parts of the apps you named are worth borrowing"
    needs: [entity, current]
    priority: 85
    anchor: entity
    scope: none
    slots:
      - {key: reference_check, type: count, kind: reference_check, distinct_by: name, min: 1, required: true}
  - id: recent
    label: "What changed recently in {category_apps}"
    foreach: none
    question: "What features have {category_apps} added or started to emphasise recently in {place}?"
    decision_unlocked: "Which emerging features to consider"
    needs: [current, norm]
    priority: 55
    anchor: category
    scope: country
    slots:
      - {key: recent_additions, type: count, kind: trend, distinct_by: topic, min: 2, required: false}
