[project]
name = "mde-verify-agent"
version = "0.1.0"
description = "Verify: checks deep Spec packs (structure critic, canary per task card, final critic); proposes patches, never writes"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "mde-llm-gateway",
  "mde-spec-core",
  "pydantic>=2.9",
  "jinja2>=3.1",
]

[project.entry-points."mde.spec.verify"]
verify = "mde_verify_agent.port:build_verify_port"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_verify_agent"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
mde-llm-gateway = { workspace = true }
mde-spec-core = { workspace = true }
