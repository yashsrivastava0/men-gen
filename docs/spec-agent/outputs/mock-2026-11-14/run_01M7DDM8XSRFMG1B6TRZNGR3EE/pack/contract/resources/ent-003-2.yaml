    - APP-002
    - APP-003
    - APP-004
    - APP-005
    x-client-errors:
    - network
    x-derived: false
    x-entity: ENT-003
    x-idempotent: true
    x-phase: later
    x-roles:
    - ROL-007
    - ROL-008
