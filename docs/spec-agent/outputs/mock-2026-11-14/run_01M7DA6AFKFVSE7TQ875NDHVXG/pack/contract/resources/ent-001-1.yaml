/users:
  get:
    operationId: OP-S001
    parameters:
    - $ref: ../components.yaml#/parameters/Cursor
    - $ref: ../components.yaml#/parameters/Limit
    - description: one field; a leading minus sorts descending
      in: query
      name: sort
      required: false
      schema:
        enum:
        - -created_at
        - -name
        - -preferred_language
        - -role
        - created_at
        - name
        - preferred_language
        - role
        type: string
    - in: query
      name: filter[name]
      required: false
      schema:
        type: string
    - in: query
      name: filter[preferred_language]
      required: false
      schema:
        enum:
        - mr
        - hi
        - en
        type: string
    - in: query
      name: filter[role]
      required: false
      schema:
        enum:
        - Buyer
        - Farmer
        - Local transport partner
        - Farmer groups (FPOs)
        - Manager side
        - Purchase manager
        - Owner
        - FPO coordinator
        - Staff
        type: string
    responses:
      '200':
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                id:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                preferred_language:
                  enum:
                  - mr
                  - hi
                  - en
                  type: string
                role:
                  enum:
                  - Buyer
                  - Farmer
                  - Local transport partner
                  - Farmer groups (FPOs)
                  - Manager side
                  - Purchase manager
                  - Owner
                  - FPO coordinator
                  - Staff
                  type: string
              required:
              - name
              - preferred_language
              - role
              type: object
        description: Success
      '401':
        $ref: ../components.yaml#/responses/Unauthenticated
      '403':
        content:
          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Not allowed for this role: forbidden'
        x-error-codes:
        - forbidden
        x-recovery:
          forbidden: stay
      '404':
        content:
          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Not found: not_found'
        x-error-codes:
        - not_found
        x-recovery:
          not_found: go_back
      '429':
        $ref: ../components.yaml#/responses/RateLimited
      default:
        $ref: ../components.yaml#/responses/Default
    security:
    - bearerAuth: []
    summary: list_user
    tags:
    - APP-001
    - APP-002
    - APP-003
    - APP-004
    x-client-errors:
    - network
    x-derived: false
    x-entity: ENT-001
    x-phase: now
    x-roles:
    - ROL-001
    - ROL-002
    - ROL-003
    - ROL-004
    - ROL-005
    - ROL-006
    - ROL-007
    - ROL-008
    - ROL-009
  post:
    operationId: OP-S003
    parameters:
    - $ref: ../components.yaml#/parameters/IdempotencyKey
    requestBody:
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              email:
                type: string
              name:
                type: string
              phone:
                type: string
              preferred_language:
                enum:
                - mr
                - hi
                - en
                type: string
              role:
                enum:
                - Buyer
                - Farmer
                - Local transport partner
                - Farmer groups (FPOs)
                - Manager side
                - Purchase manager
                - Owner
                - FPO coordinator
                - Staff
                type: string
            required:
            - name
            - preferred_language
            - role
            type: object
      required: true
    responses:
      '201':
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                id:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                preferred_language:
                  enum:
                  - mr
                  - hi
                  - en
                  type: string
                role:
                  enum:
                  - Buyer
                  - Farmer
                  - Local transport partner
                  - Farmer groups (FPOs)
                  - Manager side
                  - Purchase manager
                  - Owner
                  - FPO coordinator
                  - Staff
                  type: string
              required:
              - name
              - preferred_language
              - role
              type: object
        description: Success
        headers:
          ETag:
            schema:
              type: string
      '401':
        $ref: ../components.yaml#/responses/Unauthenticated
      '403':
        content:
          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Not allowed for this role: forbidden'
        x-error-codes:
        - forbidden
        x-recovery:
          forbidden: stay
      '409':
        content:
          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Conflict: conflict'
        x-error-codes:
        - conflict
        x-recovery:
          conflict: retry
      '422':
        content:
          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'The request cannot be applied: validation_failed'
        x-error-codes:
        - validation_failed
        x-recovery:
          validation_failed: stay
      '429':
        $ref: ../components.yaml#/responses/RateLimited
      default:
        $ref: ../components.yaml#/responses/Default
    security:
    - bearerAuth: []
    summary: create_user
    tags:
    - APP-001
    - APP-002
    - APP-003
    - APP-004
    x-client-errors:
    - network
    x-derived: false
    x-entity: ENT-001
    x-idempotent: true
    x-phase: now
    x-roles:
    - ROL-001
    - ROL-002
    - ROL-003
    - ROL-004
    - ROL-005
    - ROL-006
    - ROL-007
    - ROL-008
    - ROL-009
