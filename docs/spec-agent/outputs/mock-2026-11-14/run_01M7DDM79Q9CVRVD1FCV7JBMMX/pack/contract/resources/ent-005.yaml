/reminders:
  get:
    operationId: OP-S016
    parameters:
    - $ref: ../components.yaml#/parameters/Cursor
    - $ref: ../components.yaml#/parameters/Limit
    - description: one field; a leading minus sorts descending
      in: query
      name: sort
      required: false
      schema:
        enum:
        - -created_at
        - -scheduled_at
        - -status
        - created_at
        - scheduled_at
        - status
        type: string
    - in: query
      name: filter[booking_id]
      required: false
      schema:
        type: string
    - in: query
      name: filter[scheduled_at]
      required: false
      schema:
        format: date-time
        type: string
    - in: query
      name: filter[status]
      required: false
      schema:
        enum:
        - scheduled
        - sent
        type: string
    responses:
      '200':
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                booking_id:
                  type: string
                  x-ref: ENT-002
                id:
                  type: string
                scheduled_at:
                  description: RFC 3339, UTC
                  format: date-time
                  type: string
                status:
                  enum:
                  - scheduled
                  - sent
                  type: string
              required:
              - booking_id
              - scheduled_at
              - status
              type: object
        description: Success
      '401':
        $ref: ../components.yaml#/responses/Unauthenticated
      '403':
        content:
          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Not allowed for this role: forbidden'
        x-error-codes:
        - forbidden
        x-recovery:
          forbidden: stay
      '404':
        content:
          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Not found: not_found'
        x-error-codes:
        - not_found
        x-recovery:
          not_found: go_back
      '429':
        $ref: ../components.yaml#/responses/RateLimited
      default:
        $ref: ../components.yaml#/responses/Default
    security:
    - bearerAuth: []
    summary: list_reminder
    tags:
    - APP-001
    x-client-errors:
    - network
    x-derived: false
    x-entity: ENT-005
    x-phase: now
    x-roles:
    - ROL-002
