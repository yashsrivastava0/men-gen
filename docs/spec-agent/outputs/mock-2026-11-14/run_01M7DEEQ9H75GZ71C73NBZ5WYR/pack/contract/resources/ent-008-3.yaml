          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Conflict: conflict'
        x-error-codes:
        - conflict
        x-recovery:
          conflict: reload
      '422':
        $ref: ../components.yaml#/responses/Unprocessable
      '429':
        $ref: ../components.yaml#/responses/RateLimited
      default:
        $ref: ../components.yaml#/responses/Default
    security:
    - bearerAuth: []
    summary: Mark delivery assigned
    tags:
    - APP-001
    - APP-002
    - APP-003
    - APP-004
    x-derived: false
    x-entity: ENT-008
    x-idempotent: true
    x-phase: now
    x-roles:
