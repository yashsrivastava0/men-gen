    responses:
      '200':
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                id:
                  type: string
                status:
                  enum:
                  - unassigned
                  - assigned
                  - picked_up
                  - delivered
                  - unable_to_deliver
                  type: string
              required:
              - id
              - status
              type: object
        description: Success
      '401':
        content:
          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Not signed in: unauthenticated'
        x-error-codes:
        - unauthenticated
        x-recovery:
          unauthenticated: sign_in_again
      '403':
