          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Not allowed for this role: forbidden'
        x-error-codes:
        - forbidden
        x-recovery:
          forbidden: stay
      '404':
        content:
          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Not found: not_found'
        x-error-codes:
        - not_found
        x-recovery:
          not_found: go_back
      '409':
