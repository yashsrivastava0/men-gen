/ent-010:
  get:
    operationId: OP-028
    parameters:
    - $ref: ../components.yaml#/parameters/Cursor
    - $ref: ../components.yaml#/parameters/Limit
    - description: one field; a leading minus sorts descending
      in: query
      name: sort
      required: false
      schema:
        enum:
        - -created_at
        - -status
        - -trip_f1
        - -trip_f10
        - -trip_f11
        - -trip_f12
        - -trip_f2
        - -trip_f3
        - -trip_f4
        - created_at
        - status
        - trip_f1
        - trip_f10
        - trip_f11
        - trip_f12
        - trip_f2
        - trip_f3
        - trip_f4
        type: string
    - in: query
      name: filter[status]
      required: false
      schema:
        enum:
        - draft
        - placed
        - confirmed
        type: string
    - in: query
      name: filter[trip_f1]
      required: false
      schema:
        type: string
    - in: query
      name: filter[trip_f10]
      required: false
      schema:
        type: string
    - in: query
      name: filter[trip_f11]
      required: false
      schema:
        type: number
    - in: query
      name: filter[trip_f12]
      required: false
      schema:
        type: object
    - in: query
      name: filter[trip_f2]
      required: false
      schema:
        type: number
    - in: query
      name: filter[trip_f3]
      required: false
      schema:
        type: object
    - in: query
      name: filter[trip_f4]
      required: false
      schema:
        format: date-time
        type: string
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                items:
                  items:
                    $ref: ../schemas/ENT-010.json
                  type: array
                next_cursor:
                  type:
                  - string
                  - 'null'
              required:
              - items
              type: object
        description: Success
      '401':
        $ref: ../components.yaml#/responses/Unauthenticated
      '403':
        content:
          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Not allowed for this role: forbidden'
        x-error-codes:
        - forbidden
        x-recovery:
          forbidden: stay
      '429':
        $ref: ../components.yaml#/responses/RateLimited
      default:
        $ref: ../components.yaml#/responses/Default
    security:
    - bearerAuth: []
    summary: list_ent-010
    tags:
    - APP-001
    x-client-errors:
    - network
    x-derived: false
    x-entity: ENT-010
    x-phase: now
    x-roles:
    - ROL-001
    - ROL-002
    - ROL-003
    - ROL-004
    - ROL-005
    - ROL-006
