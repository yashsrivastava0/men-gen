/ent-011:
  get:
    operationId: OP-031
    parameters:
    - $ref: ../components.yaml#/parameters/Cursor
    - $ref: ../components.yaml#/parameters/Limit
    - description: one field; a leading minus sorts descending
      in: query
      name: sort
      required: false
      schema:
        enum:
        - -created_at
        - -status
        - -ticket_f1
        - -ticket_f10
        - -ticket_f11
        - -ticket_f12
        - -ticket_f2
        - -ticket_f3
        - -ticket_f6
        - created_at
        - status
        - ticket_f1
        - ticket_f10
        - ticket_f11
        - ticket_f12
        - ticket_f2
        - ticket_f3
        - ticket_f6
        type: string
    - in: query
      name: filter[status]
      required: false
      schema:
        enum:
        - draft
        - placed
        - confirmed
        type: string
    - in: query
      name: filter[ticket_f1]
      required: false
      schema:
        type: number
    - in: query
      name: filter[ticket_f10]
      required: false
      schema:
        type: number
    - in: query
      name: filter[ticket_f11]
      required: false
      schema:
        type: object
    - in: query
      name: filter[ticket_f12]
      required: false
      schema:
        format: date-time
        type: string
    - in: query
      name: filter[ticket_f2]
      required: false
      schema:
        type: object
    - in: query
      name: filter[ticket_f3]
      required: false
      schema:
        format: date-time
        type: string
    - in: query
      name: filter[ticket_f6]
      required: false
      schema:
        type: string
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                items:
                  items:
                    $ref: ../schemas/ENT-011.json
                  type: array
                next_cursor:
                  type:
                  - string
                  - 'null'
              required:
              - items
              type: object
        description: Success
      '401':
        $ref: ../components.yaml#/responses/Unauthenticated
      '403':
        content:
          application/json:
            schema:
              $ref: ../components.yaml#/schemas/Error
        description: 'Not allowed for this role: forbidden'
        x-error-codes:
        - forbidden
        x-recovery:
