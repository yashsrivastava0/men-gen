[project]
name = "mde-cli"
version = "0.1.0"
description = "CLI: chat, sim, budget, doctor, spec tools"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "mde-llm-gateway",
  "mde-persistence",
  "mde-prompts",
  "mde-spec-loader",
  "mde-content",
  "mde-flow",
  "mde-spec-builder",
  "mde-context-api",
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13.7",
  "pyyaml>=6.0"
]

[project.scripts]
mde = "mde_cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_cli"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
mde-llm-gateway = { workspace = true }
mde-persistence = { workspace = true }
mde-prompts = { workspace = true }
mde-spec-loader = { workspace = true }
mde-content = { workspace = true }
mde-flow = { workspace = true }
mde-spec-builder = { workspace = true }
mde-context-api = { workspace = true }
