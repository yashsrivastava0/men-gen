[project]
name = "mde-llm-gateway-api"
version = "0.1.0"
description = "FastAPI service exposing the LLM Gateway over HTTP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "mde-llm-gateway",
  "mde-prompts",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_llm_gateway_api"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
mde-llm-gateway = { workspace = true }
mde-prompts = { workspace = true }
