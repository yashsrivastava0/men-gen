# The situation catalog (spec section 9) as data. Generated by
# `python -m evals.runners.make_situations`; do not edit by hand.
situations:
- id: SIT-001
  situation: Just "hi"
  detection: Greeting intent
  behavior: Canned greeting, starter chips, input box
  scenario: tests/scenarios/SIT-001-just-hi.yaml
- id: SIT-002
  situation: Vague idea ("something like an app")
  detection: C1 low confidence
  behavior: 'Help mode: three inspiration cards, or "tell me about your business"'
  scenario: tests/scenarios/SIT-002-vague-idea.yaml
- id: SIT-003
  situation: User is confused or says "I don't know"
  detection: Confused intent
  behavior: Offer examples; "you decide"; explain the choice in one line
  scenario: tests/scenarios/SIT-003-confused.yaml
- id: SIT-004
  situation: Casual chat or brainstorming
  detection: Chit-chat intent
  behavior: Reply briefly, offer idea chips, mine the chat for slots, steer back softly after two turns
  scenario: tests/scenarios/SIT-004-chit-chat.yaml
- id: SIT-005
  situation: Asks about cost, time, tech, code ownership
  detection: Question intent
  behavior: Answer from the knowledge base only; if unknown, say how they will see it (for example "you
    will see the plan before anything is built")
  scenario: tests/scenarios/SIT-005-questions-cost-time-tech-code.yaml
- id: SIT-006
  situation: Names a known app ("like X")
  detection: C2 reference
  behavior: Ask which parts they want; R2 runs at step 3; build an original design, never copy brand assets
  scenario: tests/scenarios/SIT-006-like-x.yaml
- id: SIT-007
  situation: Pastes a long document
  detection: Upload or long text
  behavior: Extract in chunks, show "Here is what I understood", ask only missing must slots
  scenario: tests/scenarios/SIT-007-long-document.yaml
- id: SIT-008
  situation: Uploads screenshots or Figma
  detection: Upload
  behavior: Extract style and layout notes into slots; confirm
  scenario: tests/scenarios/SIT-008-screenshots-or-figma.yaml
- id: SIT-009
  situation: Several apps requested (customer plus business plus admin)
  detection: C2 multi-app flag
  behavior: Ask which to build first (one app recommended); each app is its own session and file
  scenario: tests/scenarios/SIT-009-several-apps.yaml
- id: SIT-010
  situation: Scope too large
  detection: Size estimate over cap
  behavior: Propose phase one plus a Phase 2 backlog
  scenario: tests/scenarios/SIT-010-scope-too-large.yaml
- id: SIT-011
  situation: Unsupported type (game, AR, desktop, hardware-heavy, background audio)
  detection: Stack Profile check
  behavior: Say plainly what is not supported; offer the closest option; flag anything needing a development
    build and its preview limit
  scenario: tests/scenarios/SIT-011-unsupported-type.yaml
- id: SIT-012
  situation: Sensitive domain (health, finance, children, identity documents, precise location)
  detection: C2 flags, pack rules
  behavior: Must-confirm compliance cards in Discover, conservative defaults, visible flag; R4 adds source
    pointers at step 3 (not legal advice)
  scenario: tests/scenarios/SIT-012-sensitive-domain.yaml
- id: SIT-013
  situation: Contradiction ("no login" then "user accounts")
  detection: Consistency check
  behavior: One-tap resolution card with three options
  scenario: tests/scenarios/SIT-013-contradiction.yaml
- id: SIT-014
  situation: User ignores a card
  detection: Idle or off-topic
  behavior: One nudge, then assume the recommended option and mark it
  scenario: tests/scenarios/SIT-014-ignored-card.yaml
- id: SIT-015
  situation: '"You decide"'
  detection: Phrase or button
  behavior: Pick recommended, one-line reason, mark `assumed`
  scenario: tests/scenarios/SIT-015-you-decide.yaml
- id: SIT-016
  situation: Changes their mind
  detection: Change intent
  behavior: Section 3.6; show diff
  scenario: tests/scenarios/SIT-016-changes-their-mind.yaml
- id: SIT-017
  situation: Dislikes all visual options
  detection: '"None of these"'
  behavior: Three new options; after two rounds, upload or describe
  scenario: tests/scenarios/SIT-017-dislikes-all-visual-options.yaml
- id: SIT-018
  situation: Specific detail about one screen
  detection: Text referencing a screen
  behavior: Store as that screen's notes; mark `custom`
  scenario: tests/scenarios/SIT-018-screen-detail.yaml
- id: SIT-019
  situation: Writes in another language
  detection: C1 language
  behavior: Reply in that language; app copy defaults to it; spec keywords stay English
  scenario: tests/scenarios/SIT-019-another-language.yaml
- id: SIT-020
  situation: Abusive, illegal or harmful app
  detection: C1 unsafe flag
  behavior: Decline briefly, explain, offer a safe alternative or end; log
  scenario: tests/scenarios/SIT-020-abusive-illegal-harmful.yaml
- id: SIT-021
  situation: Secrets pasted (keys, passwords)
  detection: Pattern detection plus C1 flag
  behavior: Redact before storing; explain how to connect services securely
  scenario: tests/scenarios/SIT-021-secrets-pasted.yaml
- id: SIT-022
  situation: Injection attempt in a document or search result
  detection: Untrusted-block rules, flags
  behavior: Treated as data; never executed; noted in the event log
  scenario: tests/scenarios/SIT-022-injection-in-document-or-search-result.yaml
- id: SIT-023
  situation: Abandons the session
  detection: Inactivity
  behavior: Save state (including an open gate); resume later with a summary; refresh a stale Research
    Note
  scenario: tests/scenarios/SIT-023-abandons-the-session.yaml
- id: SIT-024
  situation: Wants to start over
  detection: Intent
  behavior: Confirm; archive the draft; fresh session (memory options offered)
  scenario: tests/scenarios/SIT-024-start-over.yaml
- id: SIT-025
  situation: Types "yes" or "ok" with no gate open
  detection: Approve intent, state not a review state
  behavior: Not an approval; treat as an answer to the pending card or ask what they mean
  scenario: tests/scenarios/SIT-025-typed-yes-with-no-gate.yaml
- id: SIT-026
  situation: Types an unclear approval at a gate ("ok maybe", "looks fine but...")
  detection: C1 low confidence
  behavior: Not approved; show the gate buttons again; apply any change inside the text
  scenario: tests/scenarios/SIT-026-unclear-approval-at-a-gate.yaml
- id: SIT-027
  situation: Approves, then immediately changes
  detection: Approve then change before the next step has run
  behavior: Version changes, approval void, same gate re-opens with a diff
  scenario: tests/scenarios/SIT-027-approve-then-change.yaml
- id: SIT-028
  situation: Types while research or building is running
  detection: State PLANNING
  behavior: Queue and acknowledge; apply at Gate 2; Stop button available; a change of app type cancels
    the run (section 3.6)
  scenario: tests/scenarios/SIT-028-typing-while-research-or-building-runs.yaml
- id: SIT-029
  situation: Version changes while a gate is open
  detection: Hash mismatch
  behavior: Approval void; re-open with a diff; never approve a stale version
  scenario: tests/scenarios/SIT-029-version-changes-while-a-gate-is-open.yaml
- id: SIT-030
  situation: Gate left open for a long time
  detection: Inactivity in a review state
  behavior: State persists; no auto-approval; Enterprise reminds approvers
  scenario: tests/scenarios/SIT-030-gate-left-open.yaml
- id: SIT-031
  situation: LLM timeout or invalid output
  detection: Gateway
  behavior: One repair retry; fall back to bank cards and templates; friendly "taking longer than usual"
    message
  scenario: tests/scenarios/SIT-031-llm-timeout-or-invalid-output.yaml
- id: SIT-032
  situation: Research slow, failed, off by policy or out of budget
  detection: Timeout, error, policy or metering
  behavior: Skip it, build from Domain Pack defaults, say so in the Plan view
  scenario: tests/scenarios/SIT-032-research-slow-failed-off-or-out-of-budget.yaml
- id: SIT-033
  situation: User dislikes a research-added item
  detection: Toggle at Gate 2
  behavior: Exclude it; only the affected writers re-run
  scenario: tests/scenarios/SIT-033-dislikes-a-research-added-item.yaml
- id: SIT-034
  situation: Validation fails at build
  detection: B6, B7
  behavior: Repair up to twice; if still failing, ask the user one plain question derived from the failing
    check
  scenario: tests/scenarios/SIT-034-validation-fails-at-build.yaml
- id: SIT-035
  situation: 'Enterprise: two stakeholders disagree'
  detection: Conflicting answers on one slot
  behavior: Record both; resolve by the role precedence in policy or flag to the decision owner; never
    overwrite silently
  scenario: tests/scenarios/SIT-035-enterprise-two-stakeholders-disagree.yaml
- id: SIT-036
  situation: 'Enterprise: approvers split (one approves, one rejects)'
  detection: Gate approvals on one hash
  behavior: The build does not start; the rejection comments become change requests; the owner decides
    per policy
  scenario: tests/scenarios/SIT-036-enterprise-approvers-split.yaml
- id: SIT-037
  situation: 'Enterprise: request violates org policy (banned library, data region)'
  detection: Policy check
  behavior: Explain the constraint; show allowed alternatives as a card
  scenario: tests/scenarios/SIT-037-enterprise-policy-violation.yaml
- id: SIT-038
  situation: 'Enterprise: budget cap reached'
  detection: Metering
  behavior: Pause before the Plan phase; explain; ask an approver
  scenario: tests/scenarios/SIT-038-enterprise-budget-cap-reached.yaml
- id: SIT-039
  situation: Post-handoff light change
  detection: Change in HANDED_OFF, light
  behavior: Patch, new version, incremental frontend run; no gate
  scenario: tests/scenarios/SIT-039-post-handoff-light-change.yaml
- id: SIT-040
  situation: Post-handoff heavy change
  detection: Change in HANDED_OFF, heavy
  behavior: Patch, Gate 2 re-opens with a diff; the incremental run starts after approval
  scenario: tests/scenarios/SIT-040-post-handoff-heavy-change.yaml
