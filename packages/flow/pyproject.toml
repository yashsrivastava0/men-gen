[project]
name = "mde-flow"
version = "0.1.0"
description = "State machine, gates, approvals, run manager, hand-off ports"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "mde-spec-loader"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_flow"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
mde-spec-loader = { workspace = true }
