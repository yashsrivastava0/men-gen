# Lexicon for the Discover step: short phrases in English, Hindi (Devanagari) and Hinglish.
#
# Used by the keyword understander (the C1 mock handler and the C1 deterministic fallback), the C2,
# C3 and C14 mock handlers, and the Discover IntentRouter (deterministic fast paths before any LLM).
# It is data: phrases are normalised (casefold, punctuation and apostrophes removed) when loaded, so
# write them naturally. Nothing here is specific to one company or app type.
#
# Matching modes: "exact" compares the whole message after trimming polite fillers; "contains"
# looks for the phrase as whole words anywhere.

version: 1

fillers:
  leading: [please, pls, plz, kindly, "i want to", "i would like to", "id like to", "lets", "let us", "can we", "can you", "could you", "i want you to", "ok so", "so", chalo, kripya, "कृपया", "चलो"]
