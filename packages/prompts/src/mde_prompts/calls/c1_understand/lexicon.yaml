unknown_reply:
  en: "I do not have that detail, so I will not guess. You will see the plan before anything is built."
  hi: "मेरे पास यह जानकारी नहीं है, इसलिए मैं अंदाज़ा नहीं लगाऊँगा। कुछ भी बनने से पहले आप प्लान देखेंगे।"
  hi-Latn: "Mere paas yeh jaankari nahi hai, isliye main andaaza nahi lagaunga. Kuch bhi banne se pehle aap plan dekhenge."

chitchat_replies:
  en: ["Happy to chat for a moment.", "Fair enough, that is good to know.", "Thanks for sharing that."]
  hi: ["थोड़ी बात करके अच्छा लगा।", "ठीक है, यह जानना अच्छा रहा।", "यह बताने के लिए धन्यवाद।"]
  hi-Latn: ["Thodi baat karke accha laga.", "Theek hai, yeh jaanna accha raha.", "Yeh batane ke liye dhanyavaad."]

steer_back:
  en: "Whenever you are ready, shall we get back to your app?"
  hi: "जब आप तैयार हों, क्या हम आपके ऐप पर वापस चलें?"
  hi-Latn: "Jab aap taiyaar hon, kya hum aapke app par wapas chalein?"

