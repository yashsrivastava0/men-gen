safety:
  unsafe:
    illegal: ["sell drugs", "buy drugs", "drug dealing", cocaine, heroin, "money laundering", "launder money", scam, scams, phishing, "fake id", "fake ids", "fake passport", "fake passports", counterfeit, "credit card fraud", "steal credit cards", "pirated", "ghar se drugs"]
    harmful: [bomb, bombs, explosive, explosives, "make a weapon", "sell weapons", "buy guns", "sell guns", "stalk", "stalking", "track my ex", "spy on my wife", "spy on my husband", spyware, keylogger, malware, ransomware, ddos, "self harm", "self-harm", suicide, terrorist, terrorism, "child abuse", "child porn", "revenge porn"]
    abuse: ["you are an idiot", "you are stupid", "you idiot", "stupid bot", "useless bot", "shut up", "you are useless", "tu bekaar hai", "tum bekaar ho", "bakwaas bot", "pagal bot"]
  # Regexes run on every message and upload: no unbounded \s*, \s+ or .* (use {0,8}); the text is
  # whitespace-folded before matching (tests/security/test_regex_linearity.py holds the line).
  injection:
    - "ignore (all |any |the )?(previous|prior|above|earlier|system) (instructions|prompts?|rules|messages)"
    - "disregard (the |all |any )?(previous|prior|above|system) "
    - "(reveal|show|print|repeat|tell me|output) (me )?(your|the) (system |hidden |initial |secret )?(prompt|instructions)"
    - "you are now (a|an|in|the) "
    - "new instructions?:"
    - "system prompt"
    - "developer mode"
    - "jailbreak"
    - "do anything now"
    - "<\\s{0,8}/?\\s{0,8}system\\s{0,8}>"
    - "override (your|the) (rules|instructions|safety|policy)"
    - "forget (all|everything|your) (previous|prior|earlier|instructions)"
    - "(send|give|tell|reveal) (me )?(the |your )?(api )?(key|password|secret|token)"
    - "mark (this|the) (idea|app|request) as"
    - "(पिछले|ऊपर के) (निर्देश|निर्देशों) (को )?(अनदेखा|भूल)"
    - "pichhle instructions (ko )?(ignore|bhool)"

