[project]
name = "mde-prompts"
version = "0.1.0"
description = "Call specs C1..C14 + S1: templates, mock handlers, registry"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "mde-content",
  "jinja2>=3.1",
  "pyyaml>=6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_prompts"]

[tool.uv.sources]
mde-content = { workspace = true }
mde-core = { workspace = true }
mde-contracts = { workspace = true }
