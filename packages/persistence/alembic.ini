# Alembic configuration for the Context Engine schema (packages/persistence).
# Run from the repo root:  uv run alembic -c packages/persistence/alembic.ini upgrade head
# The database URL is NOT stored here: env.py reads DATABASE_URL through mde_core.settings
# (default: postgresql+psycopg://mde:mde@127.0.0.1:54329/mde, the private dev cluster).
[alembic]
script_location = %(here)s/src/mde_persistence/migrations
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 48

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
