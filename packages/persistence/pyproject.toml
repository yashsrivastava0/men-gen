[project]
name = "mde-persistence"
version = "0.1.0"
description = "SQLAlchemy models, repositories, Alembic migrations, Postgres job queue"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "pydantic>=2.9",
  "structlog>=24.4",
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2"
]

[project.optional-dependencies]
# Only needed to import mde_persistence.testing_plugin / testing_contract (the root dev group has them).
testing = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_persistence"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
