[project]
name = "mde-compass-intake"
version = "0.1.0"
description = "One shared reader for Compass exports (format 1, 2, trimmed) and Research outputs; drift flags and readiness for Spec"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "regex>=2024.9",
  "tld>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_compass_intake"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
