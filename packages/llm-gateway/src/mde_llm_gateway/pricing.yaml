# Price list (brief 7.9). USD per 1M tokens, quoted strings so they load as exact Decimals.
# A model or tool that is not listed here is REFUSED (UnknownModelPrice): never guess a price.
#
# One row per model; `vendor` says which provider serves it (rule 14: the vendor of a model is
# known here and nowhere else). To add a model of an existing vendor, add a row. To add a vendor,
# add a provider in `providers/` and a row per model. `cached_input_usd_per_million` is the price of
# a cache read; every provider reports `input_tokens` INCLUDING cache reads (Anthropic's separate
# counts are added up inside its provider).
version: 1

models:
  gpt-6-luna:
    vendor: openai
    input_usd_per_million: "0.10"
    cached_input_usd_per_million: "0.01"
    output_usd_per_million: "0.50"
    # Prompts above this many input tokens are billed at the multiplied rates for the WHOLE request.
    long_context:
      threshold_tokens: 272000
      input_multiplier: "2.0"
      output_multiplier: "1.5"

  # Anthropic list prices, read 2026-11-13 (platform.claude.com pricing page and the claude-api
  # skill table, cached 2026-11-03). The provider sends no cache markers, so cache writes (a
  # premium rate) never occur; a stray cache write would be booked at the plain input rate.
  claude-haiku-5-5:
    vendor: anthropic
    input_usd_per_million: "0.10"
    cached_input_usd_per_million: "0.01"
    output_usd_per_million: "0.50"
    # Above 100K prompt tokens the whole request is billed at 0.50 input / 2.50 output.
    long_context:
      threshold_tokens: 100000
      input_multiplier: "5.0"
      output_multiplier: "5.0"

  claude-sonnet-5-5:
    vendor: anthropic
    input_usd_per_million: "2.00"
    cached_input_usd_per_million: "0.10"
    output_usd_per_million: "10.00"

  claude-opus-5-5:
    vendor: anthropic
    input_usd_per_million: "4.00"
    cached_input_usd_per_million: "0.20"
    output_usd_per_million: "20.00"

tools:
  web_search:
    per_call_usd: "0.01"
    # Search content tokens are billed as input at the model rate. They normally appear inside
    # usage.input_tokens; the reservation (worst case) still assumes this many extra tokens per call.
    # L0 live smoke (2026-11-08) measured about 8,700 input tokens for ONE web_search call, so the
    # worst-case estimate assumes 12,000 (the first guess of 3,000 under-reserved).
    assumed_content_tokens: 12000
