[project]
name = "mde-research"
version = "0.1.0"
description = "Research engine: plan, search, extract, synthesize, safety"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "mde-prompts",
  "mde-content",
  "pyyaml>=6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_research"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
mde-prompts = { workspace = true }
mde-content = { workspace = true }
