[project]
name = "mde-spec-core"
version = "0.1.0"
description = "Spec Graph, validators V-01..V-45, renderer, packager, slicer, build planner, spec check (shared; no model, no network)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "regex>=2024.9",
  "coloraide>=4.0",
  "babel>=2.16",
  "faker>=30.0",
  "phonenumbers>=8.13",
  "python-stdnum>=1.20",
  "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_spec_core"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
