# Big List of Naughty Strings, vendored for the `extreme` mock profile (doc 18 section 6, FN-10).
# The loader reads the repo copy `blns.txt`; there is no network access at run time.
# The file was downloaded once, at authoring time, from the raw GitHub URL below (pinned to one commit).
version: 1
source_repo: https://github.com/minimaxir/big-list-of-naughty-strings
pinned_commit: db33ec7b1d5d9616a88c76394b7d0897bd0b97eb
pinned_commit_date: "2021-04-17"
raw_url: https://raw.githubusercontent.com/minimaxir/big-list-of-naughty-strings/db33ec7b1d5d9616a88c76394b7d0897bd0b97eb/blns.txt
licence: MIT
