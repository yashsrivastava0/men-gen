# Error catalogue (doc 17 2.9, doc 15 7.2): structured, agent-readable errors {code, severity, audience, where, why, fix, repair_class}.
# `where`, `why` and `fix` are templates; every placeholder is listed in `args`. `validators` names the checks that raise it.
# severity: error blocks the gate it is raised at; warning is listed at G2; info is only reported.
# audience: agent = written for a model or a tool that can act on it; owner = shown to the owner in plain words.
# repair_class (doc 18 3.3): A = a model-written node, goes down the repair ladder (code fix, one re-ask, flag);
#   B = a gap in a frozen node or a missing decision, one additive re-ask then listed at G2;
#   C = a generated file or the configuration, a Spec bug that fails the build loudly.
version: 1
repair_classes:
  A: model-written node; repair ladder
  B: gap in a frozen node; one additive re-ask, then listed at G2
  C: generated file or configuration; fails the build loudly
errors:
  - {code: SCHEMA_INVALID, validators: [V-01], severity: error, audience: agent, repair_class: A, args: [node_id, field, problem, allowed], where: "{node_id}.{field}", why: "{problem}", fix: "Return the node again so it matches the schema; allowed: {allowed}."}
  - {code: VOCAB_VALUE_UNKNOWN, validators: [V-24], severity: error, audience: agent, repair_class: A, args: [node_id, field, value, allowed], where: "{node_id}.{field}", why: "'{value}' is not in the closed vocabulary.", fix: "Use one of: {allowed}. A close synonym is mapped by code; anything else is asked again."}
  - {code: TIER_ABOVE_CEILING, validators: [V-24], severity: error, audience: agent, repair_class: A, args: [node_id, field, tier, ceiling], where: "{node_id}.{field}", why: "The field is marked {tier} but its ceiling is {ceiling}.", fix: "Mark it {ceiling} or lower."}
  - {code: ID_DUPLICATE, validators: [V-02], severity: error, audience: agent, repair_class: A, args: [node_id, kind], where: "{kind} {node_id}", why: "Two nodes carry the same id; code never merges them.", fix: "Return one of the nodes with a new id and keep the other unchanged."}
  - {code: ID_ALIAS_UNRESOLVED, validators: [V-02, V-32], severity: error, audience: agent, repair_class: C, args: [alias, node_id], where: "alias {alias} on {node_id}", why: "The alias does not resolve to a live node, or an id was reused.", fix: "Fix the id registry; ids are minted once and never reused."}
  - {code: ID_NAMESPACE_VIOLATION, validators: [V-32], severity: error, audience: agent, repair_class: C, args: [node_id, expected], where: "{node_id}", why: "A Spec-minted id is outside its own namespace.", fix: "Mint the id in {expected}."}
  - {code: EDGE_DANGLING, validators: [V-03], severity: error, audience: agent, repair_class: A, args: [from_id, field, to_id], where: "{from_id}.{field}", why: "It points to {to_id}, which does not exist.", fix: "Point to an existing node, or add the missing node through its owning step."}
  - {code: SCREEN_UNREACHABLE, validators: [V-04], severity: error, audience: agent, repair_class: B, args: [screen_id], where: "screen {screen_id}", why: "No entry point or action leads to it.", fix: "Add an action or an entry point that reaches it, or mark it later."}
  - {code: FLOW_STEP_BROKEN, validators: [V-05], severity: error, audience: agent, repair_class: A, args: [flow_id, stage, problem], where: "flow {flow_id}, stage {stage}", why: "{problem}", fix: "Map the stage to a real screen and action."}
  - {code: BINDING_UNRESOLVED, validators: [V-06], severity: error, audience: agent, repair_class: A, args: [screen_id, key, target], where: "screen {screen_id}, {key}", why: "'{target}' is not an entity field or operation.", fix: "Bind to an existing ENT-x.field or OP-x."}
  - {code: ACTION_TARGET_MISSING, validators: [V-07], severity: error, audience: agent, repair_class: B, args: [screen_id, action, target], where: "screen {screen_id}, action {action}", why: "The effect names {target}, which does not exist.", fix: "Name an existing screen or operation, or ask Product to add it."}
  - {code: ROLE_RULE_MISSING, validators: [V-08], severity: error, audience: agent, repair_class: B, args: [node_id], where: "{node_id}", why: "No role is allowed to use it, and access defaults to denied.", fix: "Say which roles may see or call it."}
  - {code: LIFECYCLE_BROKEN, validators: [V-09], severity: error, audience: agent, repair_class: A, args: [entity_id, problem], where: "entity {entity_id}", why: "{problem}", fix: "Make every status reachable, define the end statuses, and name the roles that move it."}
  - {code: CONTRACT_LINT_FAILED, validators: [V-10], severity: error, audience: agent, repair_class: B, args: [operation_id, problem], where: "operation {operation_id}", why: "{problem}", fix: "Fix the operation so its schemas, examples, errors and enums agree."}
  - {code: VOCABULARY_INCONSISTENT, validators: [V-11], severity: error, audience: agent, repair_class: A, args: [term_a, term_b], where: "terms '{term_a}' and '{term_b}'", why: "Two names are used for the same thing across apps.", fix: "Use one name everywhere and keep the other as an alias."}
  - {code: TOKENS_INVALID, validators: [V-12], severity: error, audience: agent, repair_class: C, args: [token, problem], where: "token {token}", why: "{problem}", fix: "Fix the token build; tokens are generated, never hand-edited."}
  - {code: CONTRAST_TOO_LOW, validators: [V-12], severity: warning, audience: owner, repair_class: A, args: [pair, ratio, needed], where: "colours {pair}", why: "The contrast is {ratio} and {needed} is needed for readable text.", fix: "The tone of the brand colour is adjusted to meet {needed}; confirm the result."}
  - {code: STATE_MISSING, validators: [V-13], severity: error, audience: agent, repair_class: A, args: [screen_id, kind], where: "screen {screen_id}", why: "Its screen type requires the {kind} state.", fix: "Instantiate it from the state library."}
  - {code: COPY_KEY_MISSING, validators: [V-14], severity: error, audience: agent, repair_class: A, args: [key, locale], where: "copy key {key}, locale {locale}", why: "The key has no text in this locale.", fix: "Write the text, or mark the region copy_unspecified so the front end writes its own."}
  - {code: FIXTURE_INVALID, validators: [V-15, V-41], severity: error, audience: agent, repair_class: A, args: [entity_id, problem], where: "fixtures of {entity_id}", why: "{problem}", fix: "Return fixtures that satisfy the schema, the counts and the edge classes."}
  - {code: FIXTURE_SENSITIVE_VALUE, validators: [V-15, V-20], severity: error, audience: agent, repair_class: A, args: [entity_id, field], where: "fixtures of {entity_id}.{field}", why: "The value looks like a real identifier, phone number or account number.", fix: "Mask it, or use a reserved example value."}
  - {code: CAPABILITY_TIER_MISSING, validators: [V-16], severity: error, audience: agent, repair_class: B, args: [feature_id], where: "feature {feature_id}", why: "It has no capability tier.", fix: "Say whether it runs in the standard stack (A), needs a native build (B) or cannot be built (C)."}
  - {code: TIER_EVIDENCE_MISSING, validators: [V-17], severity: error, audience: agent, repair_class: A, args: [node_id, field], where: "{node_id}.{field}", why: "It is Locked but has no user, document or policy evidence.", fix: "Mark it Default, or cite the evidence."}
  - {code: SCOPE_LEDGER_INCONSISTENT, validators: [V-19], severity: error, audience: agent, repair_class: B, args: [node_id, problem], where: "{node_id}", why: "{problem}", fix: "Give every screen an in-scope feature or a system requirement, and give later features no screens."}
  - {code: SECRET_IN_SPEC, validators: [V-20], severity: error, audience: agent, repair_class: C, args: [file, pattern], where: "{file}", why: "Text matching {pattern} was found.", fix: "Remove it and rotate the secret if it was real."}
  - {code: NOT_DETERMINISTIC, validators: [V-21, V-34], severity: error, audience: agent, repair_class: C, args: [file], where: "{file}", why: "Building twice gave different bytes, or a body holds volatile data.", fix: "Remove the volatile data or the unordered output; keep it as a regression fixture."}
  - {code: A11Y_LABEL_MISSING, validators: [V-22], severity: error, audience: agent, repair_class: A, args: [screen_id, key], where: "screen {screen_id}, {key}", why: "An action or an input has no accessibility label key.", fix: "Add a label copy key and an announcement where the result is not otherwise visible."}
  - {code: CAPABILITY_NOT_ALLOWED, validators: [V-23], severity: error, audience: agent, repair_class: B, args: [feature_id, capability], where: "feature {feature_id}", why: "The capability {capability} is outside the allowed stack.", fix: "Flag it at G2 as needs-engineering, or drop it."}
  - {code: FORM_WORD_FOUND, validators: [V-25], severity: warning, audience: agent, repair_class: A, args: [node_id, field, word], where: "{node_id}.{field}", why: "'{word}' names a form, not a meaning.", fix: "Say what the user needs or does, not how it looks or where it sits."}
  - {code: WIDGET_KEY, validators: [V-25], severity: warning, audience: agent, repair_class: A, args: [node_id, key], where: "{node_id}, key {key}", why: "The key ends in a word that names a widget or a trigger.", fix: "Rename it for its meaning and keep the old key as an alias."}
  - {code: TASK_OVER_BUDGET, validators: [V-26], severity: error, audience: agent, repair_class: A, args: [task_id, read, budget], where: "task {task_id}", why: "{read} read against {budget}.", fix: "Split the screens or shard; a bulky card moves its detail to its own file first."}
  - {code: FILE_OVER_CAP, validators: [V-26], severity: error, audience: agent, repair_class: A, args: [file, size, cap], where: "{file}", why: "{size} against a cap of {cap}.", fix: "Shorten it, or split it at a module boundary."}
  - {code: CALL_INPUT_OVER_LIMIT, validators: [V-26], severity: error, audience: agent, repair_class: C, args: [call, size, limit], where: "call {call}", why: "The input is {size} and the route's limit is {limit}.", fix: "Fuse fewer items into the call."}
  - {code: BUDGET_SET_INCONSISTENT, validators: [V-26], severity: error, audience: agent, repair_class: C, args: [sum, expected], where: "spec-config budgets", why: "The caps add up to {sum} but the task read budget is {expected}, so a one-screen task might not fit.", fix: "Change the caps so they add up to the task read budget; the build refuses until then."}
  - {code: CLOSURE_INCOMPLETE, validators: [V-27], severity: error, audience: agent, repair_class: C, args: [slice_id, missing], where: "slice {slice_id}", why: "The slice lacks {missing}, which its bindings, operations or copy keys need.", fix: "Add what is missing to the slice's closure."}
  - {code: RELEASE_INCONSISTENT, validators: [V-28], severity: error, audience: agent, repair_class: B, args: [node_id, problem], where: "{node_id}", why: "{problem}", fix: "Keep every in-scope screen within the cap, give no in-scope node a later dependency, and record consent before moving a must later."}
  - {code: INVENTORY_INCOMPLETE, validators: [V-29], severity: error, audience: agent, repair_class: B, args: [kind, node_id], where: "{kind} {node_id}", why: "It has no screen, or the system set is missing.", fix: "Add a screen for it, or the missing system screen from the library."}
  - {code: BINDING_TYPE_MISMATCH, validators: [V-30], severity: error, audience: agent, repair_class: A, args: [screen_id, key, expected, found], where: "screen {screen_id}, {key}", why: "The contract field is {found}, the region expects {expected}.", fix: "Bind to a field of the right type."}
  - {code: OPERATION_NOT_ROLE_GATED, validators: [V-30], severity: error, audience: agent, repair_class: B, args: [operation_id], where: "operation {operation_id}", why: "The operation exists but no role may call it.", fix: "Name the roles allowed to call it."}
  - {code: KEY_DUPLICATE, validators: [V-31], severity: error, audience: agent, repair_class: A, args: [screen_id, key], where: "screen {screen_id}", why: "The key '{key}' is used twice, and keys become test ids.", fix: "Give one of them a new key and keep the old key as an alias."}
  - {code: POLICY_PROVENANCE_MISSING, validators: [V-33], severity: error, audience: agent, repair_class: C, args: [node_id], where: "{node_id}", why: "A policy-Locked item does not cite a policy sheet id and date.", fix: "Cite policy:<sheet id>@<date> from the policy sheet."}
  - {code: BEHAVIOR_CATEGORY_MISSING, validators: [V-35], severity: error, audience: agent, repair_class: A, args: [category, profile], where: "global behaviours", why: "The {category} category applies to this app and the {profile} profile but has no entry.", fix: "Instantiate it from the library, or write the app-specific entry."}
  - {code: RESEARCH_DRIFT, validators: [V-36], severity: error, audience: agent, repair_class: A, args: [node_id, item_id, problem], where: "{node_id}, item {item_id}", why: "{problem}", fix: "Cite an official or corroborated item and copy its typed value exactly."}
  - {code: GROUNDING_NUMBER_UNSUPPORTED, validators: [V-45], severity: warning, audience: owner, repair_class: A, args: [node_id, number], where: "{node_id}", why: "The number {number} does not appear in the quote or item it cites.", fix: "Check the number against the source before approving."}
  - {code: GROUNDING_NAME_UNKNOWN, validators: [V-45], severity: warning, audience: owner, repair_class: A, args: [node_id, name], where: "{node_id}", why: "The name {name} is not in the list of providers or brands found.", fix: "Remove it, or confirm it is real."}
  - {code: RULE_VALUES_CONFLICT, validators: [V-45], severity: warning, audience: owner, repair_class: B, args: [subject, values], where: "rules about {subject}", why: "Two rules with the same subject and condition have different values: {values}.", fix: "Decide which value is right."}
  - {code: MOBILE_INTENT_FORBIDDEN, validators: [V-37], severity: error, audience: agent, repair_class: A, args: [screen_id, action, intent], where: "screen {screen_id}, action {action}", why: "The intent '{intent}' cannot exist on a phone.", fix: "State what the user needs to learn or do, and put it in the content or in another action."}
  - {code: SCREEN_TOO_DENSE_FOR_PHONE, validators: [V-37], severity: warning, audience: owner, repair_class: A, args: [screen_id, problem, limit], where: "screen {screen_id}", why: "{problem}; the phone limit is {limit}.", fix: "Split the screen, or record a mobile-fit waiver with a reason."}
  - {code: SHAPE_UNKNOWN, validators: [V-38], severity: error, audience: agent, repair_class: A, args: [screen_id, region, shape], where: "screen {screen_id}, region {region}", why: "'{shape}' is not a known information shape.", fix: "Use a known shape, or write other:<name> to put it on the gap list."}
  - {code: CARDINALITY_MISSING, validators: [V-38], severity: error, audience: agent, repair_class: A, args: [screen_id, region], where: "screen {screen_id}, region {region}", why: "A list-like region has no size bucket.", fix: "Say one, few, many or very_many, with a typical and a maximum count."}
  - {code: INTENT_UNKNOWN, validators: [V-38], severity: error, audience: agent, repair_class: A, args: [screen_id, action, intent], where: "screen {screen_id}, action {action}", why: "'{intent}' is not a known interaction intent.", fix: "Use one of the known intents."}
  - {code: NEEDS_UNCOVERED, validators: [V-38], severity: error, audience: agent, repair_class: C, args: [screen_id, region], where: "needs of screen {screen_id}", why: "Region {region} has no entry in the needs inventory.", fix: "Rebuild the needs inventory; it is generated."}
  - {code: BLOCK_UNRESOLVED, validators: [V-39], severity: error, audience: agent, repair_class: C, args: [screen_id, block_id], where: "screen {screen_id}", why: "It uses block {block_id}, which does not exist or differs in what it binds.", fix: "Rebuild the blocks; they are detected by code."}
  - {code: BLOCK_SINGLE_USE, validators: [V-39], severity: error, audience: agent, repair_class: C, args: [block_id], where: "block {block_id}", why: "A block used only once is not a block.", fix: "Inline it and remove the block."}
  - {code: STORY_COVERAGE_GAP, validators: [V-40], severity: error, audience: agent, repair_class: A, args: [node_id, problem], where: "{node_id}", why: "{problem}", fix: "Add the missing story, citation or acceptance; an assumed story is never a must."}
  - {code: MOCK_COVERAGE_GAP, validators: [V-41], severity: error, audience: agent, repair_class: A, args: [node_id, problem], where: "{node_id}", why: "{problem}", fix: "Add the missing profile, state example, hero record or asset need."}
  - {code: COULD_RULE_BROKEN, validators: [V-42], severity: error, audience: agent, repair_class: A, args: [screen_id, problem], where: "opportunities of screen {screen_id}", why: "{problem}", fix: "Keep entries Open, within the cap, each with a basis, and give essential motion an alternative."}
  - {code: ASSET_NEED_INCOMPLETE, validators: [V-43], severity: error, audience: agent, repair_class: A, args: [asset_id, missing], where: "asset {asset_id}", why: "It lacks {missing}.", fix: "Fill kind, purpose, subject, count, avoid-list, source policy, fallback and alt-text rule."}
  - {code: MOTION_ALTERNATIVE_MISSING, validators: [V-43], severity: error, audience: agent, repair_class: A, args: [intent, node_id], where: "{node_id}", why: "The essential motion '{intent}' has no alternative that does not rely on motion.", fix: "State how the same information reaches a user who has turned motion off."}
  - {code: JOURNEY_INCOMPLETE, validators: [V-44], severity: error, audience: agent, repair_class: A, args: [flow_id, problem], where: "journey {flow_id}", why: "{problem}", fix: "Give each stage a goal, screens and an emotion, and name the moments that matter and the unhappy paths."}
  - {code: WEAK_ROUTE, validators: [], severity: info, audience: owner, repair_class: A, args: [step, share], where: "step {step}", why: "{share} of the nodes needed a second try.", fix: "Consider a stronger model route for this step."}
  - {code: MONEY_BUDGET_SPENT, validators: [], severity: error, audience: owner, repair_class: B, args: [spent, cap], where: "the run", why: "{spent} has been spent of the {cap} allowed.", fix: "The run is saved and can continue if the limit is raised."}
