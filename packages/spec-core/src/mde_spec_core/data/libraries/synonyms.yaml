# Exact-synonym table for closed vocabularies (doc 18 3.2, code fix 4): a word that is truly another
# name for a vocabulary value maps to it; anything else is asked again (R-ask). Lookup is exact after
# lowercasing and turning spaces and hyphens into underscores. A value is a name, or {to, attrs} when the
# synonym also implies shape attributes ("name=value"). Never map a widget or a trigger word (see not_synonyms).
version: 1
not_synonyms:
  - {word: btn, why: "a widget, not a meaning"}
  - {word: button, why: "a widget, not a meaning"}
  - {word: cta, why: "a trigger, not a meaning"}
  - {word: modal, why: "a widget; the meaning is an action or a state"}
  - {word: sheet, why: "a widget; the meaning is an action or a state"}
  - {word: tab, why: "a widget; the meaning is a destination"}
  - {word: toast, why: "a widget; the meaning is a notice or a state"}
  - {word: banner, why: "a widget; the meaning is a notice"}
  - {word: chip, why: "a widget; the meaning is a choice or a filter"}
  - {word: card, why: "a presentation of an item, not a shape"}
  - {word: home, why: "a place in navigation, not a screen type"}
  - {word: page, why: "ambiguous: a screen, a web page or a page of content"}
