# Fixture safety rules (doc 18 6, FN-11, FN-12). Mock data is synthetic: no real-looking ID number, no phone number
# that is not masked, no real brand, no email outside the reserved example domain.
version: 1
allowed_email_domains: [example.com]
mask_char: "•"
# A phone number is found by libphonenumber's matcher at VALID strictness for each region (and any +international).
phone_regions: [IN, US, GB, AE, SN, KE, TZ, GT, CR, PA]
# Plate-like values (vehicle registration): regular expressions, matched case-insensitively on whole values.
plate_patterns:
  - '\b[A-Z]{2}[ -]?\d{1,2}[ -]?[A-Z]{1,3}[ -]?\d{4}\b'      # India: MH 15 AB 1234
  - '\b\d{2}[ -]?BH[ -]?\d{4}[ -]?[A-Z]{1,2}\b'               # India, Bharat series
  - '\b[A-Z]{2}\d{2}[ ]?[A-Z]{3}\b'                            # UK current style
# A deny-list of real brands that must not appear in mock text unless the user gave the name (allowed_names).
brand_denylist:
  - Amazon
  - Flipkart
  - Swiggy
  - Zomato
  - Paytm
  - PhonePe
  - BigBasket
  - Myntra
  - Uber
  - Ola Cabs
  - Walmart
  - Reliance
  - Tata
  - HDFC
  - ICICI
  - State Bank of India
  - Apple
  - Samsung
  - McDonald's
  - Starbucks
  - Nike
  - Adidas
  - Netflix
  - Facebook
  - Instagram
  - WhatsApp
  - Microsoft
  - Razorpay
  - Stripe
  - PayPal
  - Visa
  - Mastercard
  - Coca-Cola
  - Pepsi
  - Nestle
  - Unilever
  - IKEA
  - Toyota
  - Honda
  - Maruti
# Validators from python-stdnum: (module path, regex that selects a candidate, plain label). A candidate is matched
# in the text, compacted (spaces, dots and hyphens removed) and given to `validate()`; passing means FAIL.
stdnum_checks:
  - {module: stdnum.in_.aadhaar, pattern: '(?<![0-9])[2-9][0-9]{3}[ -]?[0-9]{4}[ -]?[0-9]{4}(?![0-9])', label: India Aadhaar}
  - {module: stdnum.in_.pan, pattern: '(?<![A-Za-z0-9])[A-Za-z]{5}[0-9]{4}[A-Za-z](?![A-Za-z0-9])', label: India PAN}
  - {module: stdnum.in_.gstin, pattern: '(?<![A-Za-z0-9])[0-9]{2}[A-Za-z]{5}[0-9]{4}[A-Za-z][0-9A-Za-z]{3}(?![A-Za-z0-9])', label: India GSTIN}
  - {module: stdnum.in_.epic, pattern: '(?<![A-Za-z0-9])[A-Za-z]{3}[0-9]{7}(?![A-Za-z0-9])', label: India voter id}
  - {module: stdnum.in_.vid, pattern: '(?<![0-9])[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}(?![0-9])', label: India virtual id}
  - {module: stdnum.iban, pattern: '(?<![A-Za-z0-9])[A-Za-z]{2}[0-9]{2}(?:[ ]?[A-Za-z0-9]{3,4}){3,8}(?![A-Za-z0-9])', label: IBAN}
  - {module: stdnum.us.ssn, pattern: '(?<![0-9])[0-9]{3}-[0-9]{2}-[0-9]{4}(?![0-9])', label: US social security number}
  - {module: stdnum.luhn, pattern: '(?<![0-9])[0-9]{4}(?:[ -]?[0-9]{4}){2,3}(?![0-9])', label: payment card number, function: is_valid}
