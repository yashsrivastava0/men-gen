omitted_unverified:
  - topic: "Traditional Chinese (Hant) fallback family"
    reason: "Only the SC, JP and KR families were read; the Traditional Chinese family's metadata was not."
  - topic: "Colour emoji and symbol fallback"
    reason: "Not in the requested script list; not read."
  - topic: "Glyph-level coverage (conjuncts, rare letters) for any script"
    reason: "METADATA.pb lists scripts, subsets and languages, not individual glyphs; no glyph audit was run."
  - topic: "Google Fonts website specimen pages as a source"
    reason: "The pages are rendered by script and returned only their titles; the source repository files were read instead."
