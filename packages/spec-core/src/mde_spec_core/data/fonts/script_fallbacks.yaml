# Per-script fallback fonts for the type tokens (doc 17, doc 18 6). Free families only.
# Read on `checked_on` from the Google Fonts source repository (github.com/google/fonts, directory ofl/<family>):
#   METADATA.pb gives name, `license: "OFL"`, `primary_script` and the subsets; OFL.txt in the same directory opens with
#   "This Font Software is licensed under the SIL Open Font License, Version 1.1." (read for Noto Sans, Noto Sans Kannada,
#   Noto Sans SC and Noto Sans Arabic; the other families carry `license: "OFL"` in METADATA.pb).
# The official licence text (openfontlicense.org) was read and is version 1.1 of 2007-02-26.
# `rtl` is a property of the script. `coverage_note` says only what METADATA.pb says; it is not a glyph audit.
# A script with no verified family is not listed (see omitted_unverified).
version: 1
checked_on: "2026-11-14"

licence_text_source: https://openfontlicense.org/open-font-license-official-text/

scripts:
  - script: Latin
    iso15924: [Latn]
    rtl: false
    family: Noto Sans
    licence: OFL-1.1
    licence_url: https://raw.githubusercontent.com/google/fonts/main/ofl/notosans/OFL.txt
    coverage_note: "Subsets in METADATA.pb: latin, latin-ext, vietnamese (plus cyrillic, greek and devanagari subsets). Variable font file NotoSans[wdth,wght].ttf."
    source_url: https://raw.githubusercontent.com/google/fonts/main/ofl/notosans/METADATA.pb
