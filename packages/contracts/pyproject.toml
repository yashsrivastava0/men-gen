[project]
name = "mde-contracts"
version = "0.1.0"
description = "Pydantic contracts: slots, cards, events, brief, research note, spec blocks, call IO, policy, ports"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "pydantic>=2.9"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_contracts"]

[tool.uv.sources]
mde-core = { workspace = true }
