id: SB-IV-03
title: Off-topic reply to a card is answered briefly, the question comes back, and the draft is untouched
tags: [interview, off-topic]
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
    expect: {event_types: [card]}
  - say: "tell me a joke"
    expect:
      event_types: [assistant_message, card]
      no_event_types: [brief_ready]
      slots:
        idea.summary: {contains: food delivery}
  - say: "what is the capital of France"
    note: second off-topic turn; the engine steers back to the interview
    expect:
      event_types: [assistant_message, card]
      slots:
        idea.summary: {contains: food delivery}
  - drive: {}
    expect: {state: BRIEF_REVIEW}
