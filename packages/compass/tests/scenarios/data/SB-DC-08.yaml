id: SB-DC-08
title: Changing a Locked answer later asks for a one-tap confirm with an impact preview
tags: [change, locked]
known_issue: BUG-12
known_issue_note: "a UI edit of a Locked, tap-confirmed value is applied at once (version +1) with no confirm card and no impact preview; docs 05 IV-02 and 11 DC-08 require one"
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
  - drive: {}
    expect:
      state: BRIEF_REVIEW
      slots:
        idea.business_model: {filled: true, tier: Locked}
  - edit: {path: idea.business_model, value: "a monthly plan for restaurants"}
    note: the slot is Locked (the user tapped it); the engine must reopen it with what would change
    expect:
      version_unchanged: true
      event_types: [card]
