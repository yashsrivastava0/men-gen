id: SB-DC-12
title: A competitor named as the user's own business is confirmed before it is treated as a reference
tags: [references, competitor]
steps:
  - say: "I own Swiggy and want a new delivery app for Pune restaurants"
    expect:
      slots:
        references: {not_tier: Locked}
      text_any: [swiggy]
  - drive: {until_frame: apps_you_like}
    expect:
      card_text_contains: [swiggy]
