id: SB-IV-11
title: Returns after days, resume from the checkpoint with a recap
tags: [pause, resume]
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
  - tap_recommended: true
  - tap_recommended: true
  - pause: true
    expect:
      state: PAUSED
      notice_code: paused
      version_unchanged: true
  - resume: true
    note: days later; the recap names the app and the next question
    expect:
      state: [INTERVIEWING, PLAYBACK, SEEDING, PROBING, BRIEF_REVIEW]
      notice_code: resumed
      text_contains: [food delivery]
      slots:
        idea.summary: {contains: food delivery}
  - drive: {}
    expect: {state: BRIEF_REVIEW}
