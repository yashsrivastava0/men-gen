id: SB-DC-13
title: User leaves midway, the draft is saved and nothing is finalized as assumed
tags: [pause, resume, draft]
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
  - tap_recommended: true
  - pause: true
    expect:
      state: PAUSED
      version_unchanged: true
      no_event_types: [brief_ready, brief_approved]
  - say: "what do you know so far"
    note: even paused, the draft can be shown
    expect:
      event_types: [playback]
  - resume: true
    expect:
      notice_code: resumed
      text_contains: [food delivery]
      slots:
        idea.summary: {contains: food delivery}
  - drive: {}
    expect: {state: BRIEF_REVIEW}
