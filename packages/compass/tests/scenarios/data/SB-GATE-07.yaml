id: SB-GATE-07
title: All three handoff probes (Research, Blueprint, Design) pass before Gate 1 opens
tags: [gate, probes, handoff]
known_issue: BUG-4
known_issue_note: "the blueprint and design probes fail in every round on the standard idea (gaps: what each feature lets people do; which words describe the look), so the Brief opens degraded (degraded_probes) and the all-three-probes-pass target is never met"
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
  - drive: {}
    expect:
      state: BRIEF_REVIEW
      probes_passed: true
      no_notice_code: degraded_probes
