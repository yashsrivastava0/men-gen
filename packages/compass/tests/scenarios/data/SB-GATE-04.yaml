id: SB-GATE-04
title: Gate 1, a typed yes counts only when the gate is open and the message is not compound
tags: [gate, typed-yes]
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
  - say: "ok"
    note: mid-interview, "ok" is not an approval of a Brief that does not exist yet
    expect:
      no_event_types: [brief_approved]
      approved: false
  - drive: {}
    expect: {state: BRIEF_REVIEW}
  - say: "ok but change the colour to green"
    note: compound, so it is a change request and never an approval
    expect:
      no_event_types: [brief_approved]
      approved: false
  - accept_all: true
  - say: "yes, looks right"
    note: gate open, plain yes
    expect:
      state: APPROVED
      event_types: [brief_approved]
