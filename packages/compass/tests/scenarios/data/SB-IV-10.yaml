id: SB-IV-10
title: Voice run-ons are split into atomic statements and read back as a numbered list
tags: [voice, echo]
steps:
  - say_voice: "so i want an app for my clinic in pune where patients can book appointments and doctors can see their schedule and also pay online and get reminders on whatsapp and hindi and english both"
    expect:
      state: [UNDERSTANDING, PLAYBACK, INTERVIEWING]
      notice_code: picked_up
      text_contains: [pune]
      text_any: ["1.", "1)", "(1)", "1:"]
      slots:
        idea.summary: {provenance: voice}
