id: SB-IV-01
title: Silence and "you decide" give a complete Brief of assumptions, none Locked
tags: [interview, assumptions, voi]
known_issue: BUG-15
known_issue_note: "\"you decide\" on the who_and_where quick form assumes nothing (notice 'Assumed: ' is empty), so audience.segments, a required slot, stays empty and the all-you-decide Brief is never approvable (auth.account_model is also left empty, BUG-1)"
steps:
  - say: "I want a food delivery app for restaurants in Pune, in Hindi and English"
    expect: {event_types: [card]}
  - drive: {mode: you_decide}
    note: every card is answered "you decide"; cards that must be confirmed are tapped (a tap is evidence)
    expect:
      state: BRIEF_REVIEW
      event_types: [brief_ready]
      slots:
        assumptions: {count_min: 3}
        idea.business_model: {not_tier: Locked}
        scope: {count_min: 1}
  - accept_all: true
    expect:
      approvable: true
final:
  questions_max: 10
  slots:
    audience.segments: {filled: true}
    idea.business_model: {status: [assumed, volunteered], not_tier: Locked}
