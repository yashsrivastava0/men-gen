[project]
name = "mde-compass"
version = "0.1.0"
description = "Compass: the first agent. Interviews the user and writes the Brief (hashed, versioned, evidence-tiered)."
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "mde-llm-gateway",
  "mde-persistence",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_compass"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
mde-llm-gateway = { workspace = true }
mde-persistence = { workspace = true }
