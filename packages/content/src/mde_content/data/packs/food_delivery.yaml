feature_parts:
  payments:
    operations: [API-listPaymentMethods, API-addPaymentMethod, API-removePaymentMethod, API-createPayment]
    entities: [ENT-PaymentMethod, ENT-Payment]
    integrations: [INT-payments]
    screens:
      checkout: {sections: [payment_method], actions: [pay_now]}
  live_order_tracking:
    operations: [API-listOrders, API-getOrder, API-cancelOrder, API-getOrderTracking, API-getCourierLocation]
    entities: [ENT-OrderEvent, ENT-OrderItem, ENT-CourierLocation]
  ratings:
    operations: [API-createRating, API-listRestaurantRatings]
    entities: [ENT-Rating]
    screens:
      home: {sections: [rate_last_order]}
      restaurant_detail: {sections: [ratings_preview]}
  saved_addresses:
    operations: [API-listAddresses, API-updateAddress, API-deleteAddress]
  push_notifications:
    operations: [API-listNotifications, API-markNotificationRead, API-registerPushToken]
    entities: [ENT-Notification]
    integrations: [INT-push_notifications]
    screens:
      settings: {sections: [notifications_group], actions: [enable_push]}
  promo_codes:
    operations: [API-listPromos, API-validatePromo]
    entities: [ENT-PromoCode]
    screens:
      home: {sections: [promo_banner]}
      cart: {sections: [promo_entry], actions: [apply_promo]}
  support:
    operations: [API-listSupportMessages, API-sendSupportMessage]
    entities: [ENT-SupportMessage]
    integrations: [INT-support]
