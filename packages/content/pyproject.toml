[project]
name = "mde-content"
version = "0.1.0"
description = "Data + loaders: questions, domain packs, recipes, themes, stack profile, policies"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "pyyaml>=6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_content"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
