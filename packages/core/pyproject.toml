[project]
name = "mde-core"
version = "0.1.0"
description = "Settings base, logging, ids, clock, errors, hashing, redaction, file lock"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_core"]
