[project]
name = "mde-spec-builder"
version = "0.1.0"
description = "Spec Builder B1..B9: baseline, proposals, validators, critic, repair, renderer, plan view"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mde-core",
  "mde-contracts",
  "mde-prompts",
  "mde-content",
  "mde-spec-loader",
  "pyyaml>=6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mde_spec_builder"]

[tool.uv.sources]
mde-core = { workspace = true }
mde-contracts = { workspace = true }
mde-prompts = { workspace = true }
mde-content = { workspace = true }
mde-spec-loader = { workspace = true }
